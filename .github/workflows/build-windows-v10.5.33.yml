name: Build Windows v10.5.33

on:
  push:
    branches:
      - build-v10.5.33-windows

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply v10.5.33 HRESULT compatibility hotfix
        shell: pwsh
        run: |
          $path = "engine/net.py"
          $content = Get-Content $path -Raw
          $anchor = "from loopback_policy import allow_loopback_port, revoke_loopback_port, snapshot as loopback_policy_snapshot"
          $insert = "`n`n# ctypes.wintypes does not expose HRESULT on every supported Python build`n# (notably some packaged Windows/Python combinations). HRESULT is always a`n# signed 32-bit LONG, so keep one stable local alias instead of depending on`n# that optional wintypes attribute at runtime.`nimport ctypes as _ctypes`ntry:`n    from ctypes import wintypes as _ctypes_wintypes`n    HRESULT = getattr(_ctypes_wintypes, `"HRESULT`", _ctypes.c_int32)`nexcept Exception:`n    HRESULT = _ctypes.c_int32`n"
          if (-not $content.Contains("HRESULT = getattr(_ctypes_wintypes")) {
            $content = $content.Replace($anchor, $anchor + $insert)
          }
          $content = $content.Replace("wintypes.HRESULT", "HRESULT")
          $content = $content.Replace("v10.5.32 uses Chromium", "v10.5.33 uses Chromium")
          Set-Content -Path $path -Value $content -Encoding UTF8

          $versionFiles = @(
            "main.py",
            "tekzite_version_info.txt",
            "tekzite_browser.manifest",
            "installer/TekziteBrowser.iss",
            "chromium_zoom_extension/manifest.json"
          )
          foreach ($file in $versionFiles) {
            $text = Get-Content $file -Raw
            $text = $text.Replace("10.5.32", "10.5.33")
            Set-Content -Path $file -Value $text -Encoding UTF8
          }

      - name: Verify hotfix source
        shell: pwsh
        run: |
          python -m py_compile main.py engine/net.py browser_features.py
          $netText = Get-Content "engine/net.py" -Raw
          if ($netText.Contains("wintypes.HRESULT")) { throw "wintypes.HRESULT remains in engine/net.py" }
          if (-not $netText.Contains("HRESULT = getattr(_ctypes_wintypes")) { throw "HRESULT compatibility alias is missing" }
          $mainText = Get-Content "main.py" -Raw
          if (-not $mainText.Contains('BROWSER_VERSION = "10.5.33"')) { throw "BROWSER_VERSION was not updated" }

      - name: Build Windows executable
        shell: pwsh
        run: .\build_windows.ps1

      - name: Prepare release files
        shell: pwsh
        run: |
          Copy-Item ".\dist\TekziteBrowser.exe" ".\Tekzite-Browser-v10.5.33-Windows-x64.exe" -Force
          $hash = (Get-FileHash ".\Tekzite-Browser-v10.5.33-Windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Tekzite-Browser-v10.5.33-Windows-x64.exe" | Set-Content ".\SHA256SUMS.txt" -Encoding ascii
          Get-Item ".\Tekzite-Browser-v10.5.33-Windows-x64.exe"
          Get-Content ".\SHA256SUMS.txt"

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Tekzite-Browser-v10.5.33-Windows-x64
          path: |
            Tekzite-Browser-v10.5.33-Windows-x64.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
