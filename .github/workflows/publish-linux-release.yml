name: Publish Linux release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("main.py").read_text(encoding="utf-8")
          match = re.search(r'BROWSER_VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
          if not match:
              raise SystemExit("Could not read BROWSER_VERSION from main.py")
          print(match.group(1))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Check whether release already exists
        id: release_check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already published; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Linux runtime libraries
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk xvfb libgl1 libx11-6 libxext6 libxrender1 libxss1 libxtst6

      - name: Verify synchronized version metadata
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: python tools/sync_version.py "${{ steps.version.outputs.version }}" --check

      - name: Install test dependencies
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run regression suite
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: python -m pytest -q tests/current

      - name: Test Chromium extension scripts
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: node tests/current/test_extension_features.cjs

      - name: Run environment doctor
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: python tools/doctor.py

      - name: Build Linux x86_64 executable
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: bash build_linux.sh

      - name: Package Linux release assets
        if: steps.release_check.outputs.exists != 'true'
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          bin_name="Tekzite-Browser-v${version}-Linux-x86_64"
          tar_name="Tekzite-Browser-v${version}-Linux-x86_64.tar.gz"
          cp dist/TekziteBrowser "$bin_name"
          chmod +x "$bin_name"
          tar -czf "$tar_name" "$bin_name"
          sha256sum "$bin_name" "$tar_name" > SHA256SUMS-Linux.txt
          echo "bin=$bin_name" >> "$GITHUB_OUTPUT"
          echo "tar=$tar_name" >> "$GITHUB_OUTPUT"

      - name: Wait for matching Windows release
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          for attempt in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              git fetch --tags --force
              tag_sha="$(git rev-list -n 1 "$tag")"
              if [[ "$tag_sha" != "${{ github.sha }}" ]]; then
                echo "Release $tag points to $tag_sha, expected ${{ github.sha }}" >&2
                exit 1
              fi
              echo "$tag is ready on the matching source commit."
              exit 0
            fi
            echo "Waiting for Windows publisher to create $tag ($attempt/60)..."
            sleep 10
          done
          echo "Timed out waiting for $tag" >&2
          exit 1

      - name: Upload Linux assets to GitHub release
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ steps.version.outputs.tag }}" \
            "./${{ steps.assets.outputs.bin }}" \
            "./${{ steps.assets.outputs.tar }}" \
            "./SHA256SUMS-Linux.txt" \
            --clobber
