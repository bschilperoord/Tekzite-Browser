name: Publish Windows release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  TARGET_VERSION: "10.5.42"

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check whether release already exists
        id: release_check
        shell: pwsh
        run: |
          $tag = "v$env:TARGET_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; nothing to publish."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Apply v10.5.42 source update
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gzipPath = ".release\v10.5.42.patch.gz"
          $patchPath = ".release\v10.5.42.patch"
          if (-not (Test-Path $gzipPath)) { throw "Release patch payload is missing: $gzipPath" }

          $input = [System.IO.File]::OpenRead($gzipPath)
          $output = [System.IO.File]::Create($patchPath)
          try {
            $gzip = [System.IO.Compression.GzipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
            try { $gzip.CopyTo($output) } finally { $gzip.Dispose() }
          } finally {
            $output.Dispose()
            $input.Dispose()
          }

          git apply --check --ignore-space-change --ignore-whitespace $patchPath
          if ($LASTEXITCODE -ne 0) { throw "v10.5.42 source patch does not apply cleanly" }
          git apply --ignore-space-change --ignore-whitespace $patchPath
          if ($LASTEXITCODE -ne 0) { throw "v10.5.42 source patch failed" }
          Remove-Item ".release" -Recurse -Force

          $versionLine = Select-String -Path "main.py" -Pattern 'BROWSER_VERSION = "10\.5\.42"' -SimpleMatch:$false
          if (-not $versionLine) { throw "main.py was not updated to v10.5.42" }

      - name: Set up Python
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run regression suite
        if: steps.release_check.outputs.exists != 'true'
        run: python -m pytest

      - name: Set up Node
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Test extension services
        if: steps.release_check.outputs.exists != 'true'
        run: node tests/current/test_extension_features.cjs

      - name: Commit v10.5.42 source to main
        if: steps.release_check.outputs.exists != 'true'
        id: source_commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Tekzite Browser v10.5.42 [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw "Could not create v10.5.42 source commit" }
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Could not push v10.5.42 source commit to main" }

      - name: Build Windows x64 binary
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: .\build_windows.ps1

      - name: Package Windows release assets
        if: steps.release_check.outputs.exists != 'true'
        id: assets
        shell: pwsh
        run: |
          $version = $env:TARGET_VERSION
          $exeName = "Tekzite-Browser-v$version-Windows-x64.exe"
          $zipName = "Tekzite-Browser-v$version-Windows-x64.zip"
          Copy-Item ".\dist\TekziteBrowser.exe" ".\$exeName" -Force
          if (Test-Path ".\$zipName") { Remove-Item ".\$zipName" -Force }
          Compress-Archive -Path ".\$exeName" -DestinationPath ".\$zipName" -CompressionLevel Optimal
          $exeHash = (Get-FileHash ".\$exeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash ".\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  $exeName",
            "$zipHash  $zipName"
          ) | Set-Content ".\SHA256SUMS.txt" -Encoding ascii
          "exe=$exeName" >> $env:GITHUB_OUTPUT
          "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Tag and publish GitHub release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = $env:TARGET_VERSION
          $tag = "v$version"
          $sha = "${{ steps.source_commit.outputs.sha }}"
          git fetch --tags --force
          git rev-parse "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -ne 0) {
            git tag -a $tag $sha -m "Tekzite Browser v$version"
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not push release tag $tag" }
          }

          $notes = @"
          Windows x64 release of Tekzite Browser v$version.

          Highlights:
          - Detects Tekzite's effective Windows HTTP/HTTPS default-browser handler correctly, including Applications-style and versioned executable handlers.
          - Registers Tekzite with Windows Default Apps for HTTP, HTTPS, .htm and .html and handles URLs passed in by Windows.
          - Shows live default-browser status in Settings.
          - Keeps all Tekzite-owned dialogs centered consistently on screen.
          - Includes the deterministic DWM viewport resize fixes from v10.5.38.

          The Windows executable is built natively on GitHub's windows-latest runner using the repository's hash-locked PyInstaller toolchain.
          "@

          gh release create $tag `
            ".\${{ steps.assets.outputs.exe }}" `
            ".\${{ steps.assets.outputs.zip }}" `
            ".\SHA256SUMS.txt" `
            --title "Tekzite Browser v$version" `
            --notes $notes `
            --target $sha
