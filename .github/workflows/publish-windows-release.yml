name: Publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_VERSION: "10.5.73"
  SEED_BRANCH: "release/v10.5.73-seed"
  SEED_SHA256: "83347ee2ef2f85400b9724fcace956137d51b1a59767f12860232eb47c7cf816"

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check whether release already exists
        id: release_check
        shell: pwsh
        run: |
          $tag = "v$env:TARGET_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "$tag is already published; nothing to do."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Set up Python
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Materialize v10.5.73 source
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin "refs/heads/$($env:SEED_BRANCH):refs/remotes/origin/$($env:SEED_BRANCH)"
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch release seed branch" }

          $parts = @(git ls-tree -r --name-only "origin/$env:SEED_BRANCH" -- .release |
            Where-Object { $_ -like ".release/v$env:TARGET_VERSION.source.tar.xz.b64.*" } |
            Sort-Object)
          if ($parts.Count -ne 22) {
            throw "Expected 22 release payload parts, got $($parts.Count)"
          }

          $b64 = New-Object System.Text.StringBuilder
          foreach ($part in $parts) {
            $spec = "origin/$($env:SEED_BRANCH):$part"
            $chunkLines = @(git show $spec)
            if ($LASTEXITCODE -ne 0) { throw "Could not read $part" }
            [void]$b64.Append(($chunkLines -join "").Trim())
          }

          $archive = Join-Path $env:RUNNER_TEMP "tekzite-v$env:TARGET_VERSION.tar.xz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64.ToString()))
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SEED_SHA256) {
            throw "Release payload hash mismatch: $hash"
          }
          Write-Host "Verified release payload SHA-256: $hash"

          $extract = Join-Path $env:RUNNER_TEMP "tekzite-release-source"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $env:ARCHIVE_PATH = $archive
          $env:EXTRACT_PATH = $extract
          @'
          import lzma
          import os
          import tarfile

          archive = os.environ["ARCHIVE_PATH"]
          out = os.environ["EXTRACT_PATH"]
          with lzma.open(archive, "rb") as stream:
              with tarfile.open(fileobj=stream, mode="r:") as tar:
                  tar.extractall(out, filter="data")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Could not extract release payload" }

          $srcRoot = Join-Path $extract "Tekzite-Browser-v$env:TARGET_VERSION-Source"
          if (-not (Test-Path (Join-Path $srcRoot "main.py"))) {
            throw "Release source root not found: $srcRoot"
          }

          Get-ChildItem -Force | Where-Object { $_.Name -ne ".git" } | Remove-Item -Recurse -Force
          Get-ChildItem -Force $srcRoot | ForEach-Object {
            Copy-Item $_.FullName -Destination "." -Recurse -Force
          }

      - name: Set up Node
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify synchronized version metadata
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: python tools\sync_version.py "$env:TARGET_VERSION" --check

      - name: Install test dependencies
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run regression suite
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: python -m pytest -q

      - name: Test Chromium extension scripts
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: node tests\current\test_extension_features.cjs

      - name: Run environment doctor
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: python tools\doctor.py

      - name: Commit v10.5.73 source
        id: source
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The GITHUB_TOKEN may push application source, but GitHub blocks it from
          # creating/updating workflow files. Keep the authorized workflows from
          # the triggering main commit; workflows are synchronized separately.
          git restore --source="origin/main" -- .github/workflows
          if ($LASTEXITCODE -ne 0) { throw "Could not restore authorized workflow files" }
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release v$env:TARGET_VERSION [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit release source" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Could not push release source to main" }
          }
          $sourceCommit = (git rev-parse HEAD).Trim()
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT
          Write-Host "Release source commit: $sourceCommit"

      - name: Build Windows x64 executable
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: .\build_windows.ps1

      - name: Verify Windows executable version
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-Item ".\dist\TekziteBrowser.exe"
          $expected = $env:TARGET_VERSION
          $fileVersion = [string]$exe.VersionInfo.FileVersion
          $productVersion = [string]$exe.VersionInfo.ProductVersion
          Write-Host "FileVersion=$fileVersion ProductVersion=$productVersion"
          if (-not $fileVersion.StartsWith($expected)) {
            throw "Built FileVersion '$fileVersion' does not match $expected"
          }
          if (-not $productVersion.StartsWith($expected)) {
            throw "Built ProductVersion '$productVersion' does not match $expected"
          }

      - name: Package release assets
        if: steps.release_check.outputs.exists != 'true'
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TARGET_VERSION
          $exeName = "Tekzite-Browser-v$version-Windows-x64.exe"
          $zipName = "Tekzite-Browser-v$version-Windows-x64.zip"
          Copy-Item ".\dist\TekziteBrowser.exe" ".\$exeName" -Force
          if (Test-Path ".\$zipName") { Remove-Item ".\$zipName" -Force }
          Compress-Archive -Path ".\$exeName" -DestinationPath ".\$zipName" -CompressionLevel Optimal
          $exeHash = (Get-FileHash ".\$exeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash ".\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$exeHash  $exeName", "$zipHash  $zipName") | Set-Content ".\SHA256SUMS.txt" -Encoding ascii
          "exe=$exeName" >> $env:GITHUB_OUTPUT
          "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Tag release commit
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:TARGET_VERSION"
          $sha = "${{ steps.source.outputs.source_commit }}"
          git fetch --tags --force
          git rev-parse "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagSha = (git rev-list -n 1 $tag).Trim()
            if ($tagSha -ne $sha) {
              throw "Existing tag $tag points to $tagSha instead of release commit $sha"
            }
            Write-Host "$tag already points to this release commit."
          } else {
            git tag -a $tag $sha -m "Tekzite Browser $tag"
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not push release tag $tag" }
          }

      - name: Publish GitHub release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TARGET_VERSION
          $tag = "v$version"
          $sourceCommit = "${{ steps.source.outputs.source_commit }}"

          $changeLog = Get-Content -Raw "CHANGELOG.md"
          $escaped = [regex]::Escape($version)
          $match = [regex]::Match($changeLog, "(?ms)^# v$escaped\b.*?(?=^# v|\z)")
          if ($match.Success) {
            $notes = $match.Value.Trim()
          } else {
            $notes = "Tekzite Browser v$version for Windows x64."
          }
          $notes += "`r`n`r`nThe Windows executable is built natively on GitHub's windows-latest runner after the regression suite, Chromium extension checks, version verification, and environment doctor pass."

          gh release create $tag `
            ".\${{ steps.assets.outputs.exe }}" `
            ".\${{ steps.assets.outputs.zip }}" `
            ".\SHA256SUMS.txt" `
            --title "Tekzite Browser v$version" `
            --notes $notes `
            --target $sourceCommit