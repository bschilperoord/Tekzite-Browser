name: Publish Windows release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  TARGET_VERSION: "10.5.54"

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check whether release already exists
        id: release_check
        shell: pwsh
        run: |
          $tag = "v$env:TARGET_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Apply v10.5.54 source update
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $partFiles = @(Get-ChildItem ".release\v10.5.54.patch.b64.*" | Sort-Object Name)
          if ($partFiles.Count -ne 4) {
            throw "Expected 4 release patch chunks, found $($partFiles.Count)"
          }

          $builder = [System.Text.StringBuilder]::new()
          foreach ($part in $partFiles) {
            [void]$builder.Append((Get-Content -Raw $part.FullName).Trim())
          }

          $gzipPath = ".release\v10.5.54.patch.gz"
          $patchPath = ".release\v10.5.54.patch"
          [System.IO.File]::WriteAllBytes(
            $gzipPath,
            [Convert]::FromBase64String($builder.ToString())
          )

          $input = [System.IO.File]::OpenRead($gzipPath)
          $output = [System.IO.File]::Create($patchPath)
          try {
            $gzip = [System.IO.Compression.GzipStream]::new(
              $input,
              [System.IO.Compression.CompressionMode]::Decompress
            )
            try { $gzip.CopyTo($output) } finally { $gzip.Dispose() }
          } finally {
            $output.Dispose()
            $input.Dispose()
          }

          git apply --reject --ignore-space-change --ignore-whitespace $patchPath
          $applyExit = $LASTEXITCODE
          $rejects = @(Get-ChildItem -Path . -Recurse -Filter "*.rej" -ErrorAction SilentlyContinue)
          $allowedRejects = @(
            "installer/README.txt.rej",
            "tests/current/test_stability_v1011.py.rej",
            "tests/current/test_startup_input_v86.py.rej"
          )
          foreach ($reject in $rejects) {
            $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $reject.FullName).Replace("\", "/")
            if ($allowedRejects -notcontains $relative) {
              Write-Host "Unexpected patch reject: $relative"
              Get-Content $reject.FullName
              throw "v10.5.54 source patch has an unexpected rejected hunk"
            }
          }
          if ($applyExit -ne 0 -and $rejects.Count -eq 0) {
            throw "v10.5.54 source patch failed with exit code $applyExit"
          }
          $rejects | Remove-Item -Force

          @'
          from pathlib import Path
          import re

          installer = Path("installer/README.txt")
          body = installer.read_text(encoding="utf-8")
          body = re.sub(
              r"Tekzite-Browser-Setup-10\.5\.\d+\.exe",
              "Tekzite-Browser-Setup-10.5.54.exe",
              body,
          )
          installer.write_text(body, encoding="utf-8")

          info_path = Path("tekzite_version_info.txt")
          info = info_path.read_text(encoding="utf-8")
          info = re.sub(r"filevers=\(10,\s*5,\s*\d+,\s*0\)", "filevers=(10, 5, 54, 0)", info)
          info = re.sub(r"prodvers=\(10,\s*5,\s*\d+,\s*0\)", "prodvers=(10, 5, 54, 0)", info)
          info = re.sub(r"u'10\.5\.\d+'", "u'10.5.54'", info)
          info_path.write_text(info, encoding="utf-8")

          stability = Path("tests/current/test_stability_v1011.py")
          body = stability.read_text(encoding="utf-8")
          body = re.sub(r'version="10\.5\.\d+\.0"', 'version="10.5.54.0"', body)
          body = re.sub(
              r"extension\['version'\] == '10\.5\.\d+'",
              "extension['version'] == '10.5.54'",
              body,
          )
          body = re.sub(
              r"filevers=\(10,\s*5,\s*\d+,\s*0\)",
              "filevers=(10, 5, 54, 0)",
              body,
          )
          body = re.sub(
              r"u'ProductVersion', u'10\.5\.\d+'",
              "u'ProductVersion', u'10.5.54'",
              body,
          )
          stability.write_text(body, encoding="utf-8")

          startup = Path("tests/current/test_startup_input_v86.py")
          body = startup.read_text(encoding="utf-8")
          body = re.sub(
              r'BROWSER_VERSION = "10\.5\.\d+"',
              'BROWSER_VERSION = "10.5.54"',
              body,
          )
          startup.write_text(body, encoding="utf-8")
          '@ | python -

          Remove-Item ".release" -Recurse -Force

          $versionLine = Select-String -Path "main.py" -Pattern 'BROWSER_VERSION = "10\.5\.54"'
          if (-not $versionLine) {
            throw "main.py was not updated to v10.5.54"
          }

      - name: Set up Python
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run regression suite
        if: steps.release_check.outputs.exists != 'true'
        run: python -m pytest

      - name: Set up Node
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Test extension services
        if: steps.release_check.outputs.exists != 'true'
        run: node tests/current/test_extension_features.cjs

      - name: Commit v10.5.54 source to main
        if: steps.release_check.outputs.exists != 'true'
        id: source_commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Tekzite Browser v10.5.54 [skip ci]"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create v10.5.54 source commit"
          }
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push v10.5.54 source commit to main"
          }

      - name: Build Windows x64 binary
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: .\build_windows.ps1

      - name: Package Windows release assets
        if: steps.release_check.outputs.exists != 'true'
        id: assets
        shell: pwsh
        run: |
          $version = $env:TARGET_VERSION
          $exeName = "Tekzite-Browser-v$version-Windows-x64.exe"
          $zipName = "Tekzite-Browser-v$version-Windows-x64.zip"
          Copy-Item ".\dist\TekziteBrowser.exe" ".\$exeName" -Force
          if (Test-Path ".\$zipName") { Remove-Item ".\$zipName" -Force }
          Compress-Archive -Path ".\$exeName" -DestinationPath ".\$zipName" -CompressionLevel Optimal
          $exeHash = (Get-FileHash ".\$exeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash ".\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$exeHash  $exeName", "$zipHash  $zipName") | Set-Content ".\SHA256SUMS.txt" -Encoding ascii
          "exe=$exeName" >> $env:GITHUB_OUTPUT
          "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Tag and publish GitHub release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = $env:TARGET_VERSION
          $tag = "v$version"
          $sha = "${{ steps.source_commit.outputs.sha }}"
          git fetch --tags --force
          git rev-parse "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -ne 0) {
            git tag -a $tag $sha -m "Tekzite Browser v$version"
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not push release tag $tag" }
          }

          $notes = @"
          Windows x64 release of Tekzite Browser v$version.

          Highlights:
          - Adds privacy-first local omnibox autocomplete with keyboard navigation.
          - Keeps the working foreground-native Startpage/DWM keyboard input path.
          - Rebuilds the DWM destination cleanly across minimize/restore instead of carrying stale HWND state.
          - Refreshes the native Tk root handle after restore so browser dragging and the DWM page stay locked together.
          - Hardens Tk restore against transient withdrawn/unmapped states so the Python window does not disappear after minimizing.
          - Retains Windows default-browser integration and deterministic DWM viewport resizing.

          The Windows executable is built natively on GitHub's windows-latest runner after the full Python regression suite and Chromium extension checks pass.
          "@

          gh release create $tag `
            ".\${{ steps.assets.outputs.exe }}" `
            ".\${{ steps.assets.outputs.zip }}" `
            ".\SHA256SUMS.txt" `
            --title "Tekzite Browser v$version" `
            --notes $notes `
            --target $sha
