name: Publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Get-Content -Raw "main.py"
          $match = [regex]::Match($source, 'BROWSER_VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $match.Success) { throw "Could not read BROWSER_VERSION from main.py" }
          $version = $match.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Check whether release already exists
        id: release_check
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "$tag is already published; nothing to do."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Set up Python
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify synchronized version metadata
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: python tools\sync_version.py "${{ steps.version.outputs.version }}" --check

      - name: Install test dependencies
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run regression suite
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: python -m pytest -q

      - name: Test Chromium extension scripts
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: node tests\current\test_extension_features.cjs

      - name: Run environment doctor
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: python tools\doctor.py

      - name: Build Windows x64 executable
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: .\build_windows.ps1

      - name: Verify Windows executable version
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-Item ".\dist\TekziteBrowser.exe"
          $expected = "${{ steps.version.outputs.version }}"
          $fileVersion = [string]$exe.VersionInfo.FileVersion
          $productVersion = [string]$exe.VersionInfo.ProductVersion
          Write-Host "FileVersion=$fileVersion ProductVersion=$productVersion"
          if (-not $fileVersion.StartsWith($expected)) {
            throw "Built FileVersion '$fileVersion' does not match $expected"
          }
          if (-not $productVersion.StartsWith($expected)) {
            throw "Built ProductVersion '$productVersion' does not match $expected"
          }

      - name: Package release assets
        if: steps.release_check.outputs.exists != 'true'
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $exeName = "Tekzite-Browser-v$version-Windows-x64.exe"
          $zipName = "Tekzite-Browser-v$version-Windows-x64.zip"
          Copy-Item ".\dist\TekziteBrowser.exe" ".\$exeName" -Force
          if (Test-Path ".\$zipName") { Remove-Item ".\$zipName" -Force }
          Compress-Archive -Path ".\$exeName" -DestinationPath ".\$zipName" -CompressionLevel Optimal
          $exeHash = (Get-FileHash ".\$exeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash ".\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$exeHash  $exeName", "$zipHash  $zipName") | Set-Content ".\SHA256SUMS.txt" -Encoding ascii
          "exe=$exeName" >> $env:GITHUB_OUTPUT
          "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Tag release commit
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.version.outputs.tag }}"
          $sha = "${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git rev-parse "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagSha = (git rev-list -n 1 $tag).Trim()
            if ($tagSha -ne $sha) {
              throw "Existing tag $tag points to $tagSha instead of release commit $sha"
            }
            Write-Host "$tag already points to this release commit."
          } else {
            git tag -a $tag $sha -m "Tekzite Browser $tag"
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not push release tag $tag" }
          }

      - name: Publish GitHub release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"

          $changeLog = Get-Content -Raw "CHANGELOG.md"
          $escaped = [regex]::Escape($version)
          $match = [regex]::Match($changeLog, "(?ms)^# v$escaped\b.*?(?=^# v|\z)")
          if ($match.Success) {
            $notes = $match.Value.Trim()
          } else {
            $notes = "Tekzite Browser v$version for Windows x64."
          }
          $notes += "`r`n`r`nThe Windows executable is built natively on GitHub's windows-latest runner after the regression suite, Chromium extension checks, version verification, and environment doctor pass."

          gh release create $tag `
            ".\${{ steps.assets.outputs.exe }}" `
            ".\${{ steps.assets.outputs.zip }}" `
            ".\SHA256SUMS.txt" `
            --title "Tekzite Browser v$version" `
            --notes $notes `
            --target "${{ github.sha }}"