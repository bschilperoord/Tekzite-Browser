name: Build Windows test artifact

on:
  push:
    branches:
      - "dev/v10.5.114-dialog-alpha"
      - "dev/v10.5.114-dialog-freeze-fix"
      - "dev/v10.5.114-dialog-first-event-fix"
      - "dev/v10.5.119-auth-close-guard"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run native dialog regression
        shell: pwsh
        run: python -m pytest -q tests\current\test_v105106_native_dialogs_centering.py

      - name: Run current regression suite
        shell: pwsh
        run: python -m pytest -q tests\current

      - name: Test Chromium extension scripts
        shell: pwsh
        run: node tests\current\test_extension_features.cjs

      - name: Build Windows x64
        shell: pwsh
        run: .\build_windows.ps1

      - name: Package test build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exeName = "Tekzite-Browser-v10.5.119-auth-fix-Windows-x64.exe"
          $zipName = "Tekzite-Browser-v10.5.119-auth-fix-Windows-x64.zip"
          Copy-Item ".\dist\TekziteBrowser.exe" ".\$exeName" -Force
          Compress-Archive -Path ".\$exeName" -DestinationPath ".\$zipName" -CompressionLevel Optimal -Force
          $exeHash = (Get-FileHash ".\$exeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash ".\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$exeHash  $exeName", "$zipHash  $zipName") | Set-Content ".\SHA256SUMS-auth-fix.txt" -Encoding ascii

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: Tekzite-Browser-v10.5.119-auth-fix-Windows-x64
          path: |
            Tekzite-Browser-v10.5.119-auth-fix-Windows-x64.exe
            Tekzite-Browser-v10.5.119-auth-fix-Windows-x64.zip
            SHA256SUMS-auth-fix.txt
          if-no-files-found: error
          retention-days: 14
