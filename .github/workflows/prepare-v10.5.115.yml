name: Prepare v10.5.115 release metadata

on:
  push:
    branches:
      - "release/v10.5.115"

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Synchronize release metadata
        run: |
          python tools/sync_version.py 10.5.115
          python tools/sync_version.py 10.5.115 --check

      - name: Add release notes
        shell: python
        run: |
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          heading = "# v10.5.115 - Reliable native JavaScript dialogs"
          if not text.startswith(heading):
              notes = """# v10.5.115 - Reliable native JavaScript dialogs

- Fixes the first native Tk JavaScript dialog sometimes failing to appear while Chromium navigation is still committing its target.
- Lets the dialog bridge use Chromium's already-live in-memory target before the Tk tab model receives its target ID, breaking the first-navigation modal deadlock.
- Keeps JavaScript alert, confirm, prompt and before-unload dialogs responsive by deferring synchronous Chromium zoom and DWM settle work until after the dialog is answered.
- Retains the dual browser-target/direct-page CDP observer fallback introduced in v10.5.114.

"""
              p.write_text(notes + text, encoding="utf-8")

      - name: Remove one-shot release prep workflow
        run: git rm .github/workflows/prepare-v10.5.115.yml

      - name: Commit prepared release source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Tekzite Browser v10.5.115 release"
          git push origin HEAD:release/v10.5.115
