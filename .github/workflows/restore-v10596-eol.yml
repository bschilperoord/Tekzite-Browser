name: One-shot line-ending restore

on:
  push:
    branches: [dev/v10.5.96-network-connections-ownership]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Restore original repository line endings
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              text=True,
          ).splitlines()

          for name in changed:
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  original = subprocess.check_output(["git", "show", f"origin/main:{name}"])
              except subprocess.CalledProcessError:
                  continue
              current = path.read_bytes()
              if b"\0" in current or b"\0" in original:
                  continue

              original_crlf = b"\r\n" in original
              normalized = current.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              desired = normalized.replace(b"\n", b"\r\n") if original_crlf else normalized
              if desired != current:
                  path.write_bytes(desired)
          PY
          rm -f .github/workflows/restore-v10596-eol.yml

      - name: Commit clean line endings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No line-ending cleanup needed."
            exit 0
          fi
          git commit -m "Restore v10.5.96 repository line endings"
          git push origin HEAD:dev/v10.5.96-network-connections-ownership
