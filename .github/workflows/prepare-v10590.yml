name: Prepare v10.5.90 compact UI release

on:
  push:
    branches: [dev/v10.5.90-compact-ui-copy]
    paths:
      - ".github/workflows/prepare-v10590.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest

    steps:
      - name: Checkout compact UI branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Add v10.5.90 changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          entry = """# v10.5.90 - Compact dialogs and feature copy

          - Removes large explanatory text blocks from Tekzite-owned dialogs and feature windows without removing their controls, state, or diagnostic values.
          - Compacts Settings labels and helper copy across startup, tabs, renderer, privacy, downloads, default-browser, update, and zoom options.
          - Simplifies Privacy Shield into concise status sections for active privacy controls, network state, and session counters.
          - Shortens Site Info, History, updater, JavaScript inspector, request timeline, and Local Ports copy while retaining security and privacy state.
          - Trims Live Socket View and connection-detail prose while preserving raw endpoints, hostnames, attribution, TLS, response, caller, and process data.
          - Keeps concise provenance hints such as UDP peer attribution through Windows Kernel-Network ETW.
          - Updates regressions to verify the compact wording and the underlying feature guarantees instead of requiring legacy paragraph text.
          """
          if not text.startswith("# v10.5.90"):
              p.write_text(entry.strip() + "\n\n" + text.lstrip(), encoding="utf-8")
          '@ | python -

      - name: Synchronize v10.5.90 metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools\sync_version.py 10.5.90
          python tools\sync_version.py 10.5.90 --check

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run current regression suite
        shell: pwsh
        run: python -m pytest -q tests/current

      - name: Test Chromium extension scripts
        shell: pwsh
        run: node tests\current\test_extension_features.cjs

      - name: Run environment doctor
        shell: pwsh
        run: python tools\doctor.py

      - name: Commit prepared release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.whitespace cr-at-eol
          git add -A
          git diff --cached --check
          git commit -m "Prepare Tekzite Browser v10.5.90"
          git push origin HEAD:dev/v10.5.90-compact-ui-copy
