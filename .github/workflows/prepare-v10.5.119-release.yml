name: Prepare v10.5.119 release

on:
  push:
    branches:
      - "dev/dwm-white-surface-frame-gate"
    paths:
      - ".github/workflows/prepare-v10.5.119-release.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Synchronize v10.5.119 metadata
        run: python tools/sync_version.py 10.5.119

      - name: Add v10.5.119 changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          header = "# v10.5.119 - DWM first-frame reveal guard\n"
          if not text.startswith(header):
              notes = """# v10.5.119 - DWM first-frame reveal guard

          - Prevents an unproven Chromium native frame from exposing Tekzite's raw white DWM destination during navigation.
          - Keeps the native Tekzite canvas visible when the hidden DWM first-frame gate times out, then retries frame readiness asynchronously.
          - Reveals the native DWM surface only after Chromium proves a paintable frame for the active target.
          - Falls back to Tekzite's interactive light Chromium surface when the deferred native frame still cannot be proven, instead of showing a blank white surface.
          - Adds dedicated regression coverage for the native-wait state, hidden retry path, and software fallback contract.
          - Preserves the v10.5.118 real Chromium extension controls and Most visited omnibar-focus fixes.

          """
              path.write_text(notes + text, encoding="utf-8")
          PY

      - name: Remove preview-only workflows
        shell: bash
        run: |
          rm -f .github/workflows/build-dwm-frame-gate-preview.yml
          rm -f .github/workflows/prepare-v10.5.119-release.yml

      - name: Commit synchronized release head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Tekzite Browser v10.5.119"
          git push origin HEAD:dev/dwm-white-surface-frame-gate
