name: Synchronize v10.5.118 preview version

on:
  push:
    branches:
      - "dev/v10.5.118-native-extension-ui"

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Synchronize all version metadata
        run: |
          python tools/sync_version.py 10.5.118
          python tools/sync_version.py 10.5.118 --check
      - name: Remove one-shot workflow
        run: git rm .github/workflows/sync-v10.5.118-preview.yml
      - name: Commit synchronized preview version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize Tekzite preview version to v10.5.118"
          git push origin HEAD:dev/v10.5.118-native-extension-ui
