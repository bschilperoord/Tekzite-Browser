name: Prepare v10.5.132 stable candidate

on:
  push:
    branches: ["feature/marquee-dark-websites"]
    paths: [".github/workflows/prepare-v105132.yml"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Synchronize all version metadata and current tests
        shell: pwsh
        run: |
          python tools/sync_version.py 10.5.132
          if ($LASTEXITCODE -ne 0) { throw "Version synchronization failed" }
          python tools/sync_version.py 10.5.132 --check
          if ($LASTEXITCODE -ne 0) { throw "Version metadata inconsistent" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Whitespace errors" }
      - name: Install regression dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw "Runtime installation failed" }
          python -m pip install --only-binary=:all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed" }
      - name: Verify release candidate on Windows
        shell: pwsh
        run: |
          python -m pytest -q tests/current
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }
          node tests/current/test_extension_features.cjs
          if ($LASTEXITCODE -ne 0) { throw "Chromium extension tests failed" }
      - name: Commit synchronized release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.py tekzite_browser.manifest tekzite_version_info.txt installer/TekziteBrowser.iss installer/README.txt chromium_zoom_extension/manifest.json README.md tests/current
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Staged whitespace errors" }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "Version sync unexpectedly produced no changes" }
          git commit -m "Prepare v10.5.132 stable release metadata"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
          git push origin HEAD:refs/heads/feature/marquee-dark-websites
          if ($LASTEXITCODE -ne 0) { throw "Could not push version synchronization" }
