name: CI

on:
  push:
    branches-ignore:
      - "dev/v10.5.114-dialog-alpha"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          python -m pip install -r requirements-dev.txt
      - name: Run current regression suite
        shell: pwsh
        run: python -m pytest -q tests/current

  extension-live-update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux64
            binary: chrome-linux64/chrome
          - os: windows-latest
            platform: win64
            binary: chrome-win64/chrome.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Download Chrome for Testing
        shell: bash
        run: |
          python - <<'PY'
          import io, json, os, urllib.request, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'tekzite-test-chrome'
          metadata = json.load(urllib.request.urlopen('https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json', timeout=30))
          download = next(row for row in metadata['channels']['Stable']['downloads']['chrome'] if row['platform'] == '${{ matrix.platform }}')
          with urllib.request.urlopen(download['url'], timeout=60) as response:
              zipfile.ZipFile(io.BytesIO(response.read())).extractall(root)
          if '${{ matrix.platform }}' == 'linux64':
              for name in ('chrome', 'chrome_crashpad_handler', 'chrome_sandbox'):
                  (root / 'chrome-linux64' / name).chmod(0o755)
          PY
      - name: Verify immediate extension activation and settings retention
        run: python tools/test_extension_live_update.py "${{ runner.temp }}/tekzite-test-chrome/${{ matrix.binary }}"
      - name: Install OneFile test dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify OneFile restart survives parent resource cleanup
        run: python tools/test_onefile_restart.py
