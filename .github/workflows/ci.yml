name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          python -m pip install -r requirements-dev.txt
      - name: Run current regression suite
        shell: pwsh
        run: python -m pytest -q tests/current

      - name: Build Windows preview executable
        if: github.ref == 'refs/heads/dev/v10.5.108-dialog-hwnd'
        shell: pwsh
        run: .\build_windows.ps1

      - name: Upload Windows preview artifact
        if: github.ref == 'refs/heads/dev/v10.5.108-dialog-hwnd'
        uses: actions/upload-artifact@v4
        with:
          name: Tekzite-v10.5.108-dialog-hwnd-Windows-x64
          path: dist/TekziteBrowser.exe
          if-no-files-found: error
          retention-days: 14