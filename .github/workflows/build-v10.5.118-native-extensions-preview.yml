name: Build v10.5.118 native extension UI preview

on:
  push:
    branches:
      - "dev/v10.5.118-native-extension-ui"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run current regression suite
        shell: pwsh
        run: python -m pytest -q tests\current

      - name: Test Chromium extension scripts
        shell: pwsh
        run: |
          node --check chromium_zoom_extension\background.js
          node --check chromium_zoom_extension\features.js
          node tests\current\test_extension_features.cjs

      - name: Build Windows x64
        shell: pwsh
        run: .\build_windows.ps1

      - name: Package flat preview
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exeName = "Tekzite-Browser-v10.5.118-NativeExtensions-Preview-Windows-x64.exe"
          Copy-Item ".\dist\TekziteBrowser.exe" ".\$exeName" -Force
          $exeHash = (Get-FileHash ".\$exeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$exeHash  $exeName") | Set-Content ".\SHA256SUMS-v10.5.118-preview.txt" -Encoding ascii

      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Tekzite-Browser-v10.5.118-NativeExtensions-Preview-Windows-x64
          path: |
            Tekzite-Browser-v10.5.118-NativeExtensions-Preview-Windows-x64.exe
            SHA256SUMS-v10.5.118-preview.txt
          if-no-files-found: error
          retention-days: 14
