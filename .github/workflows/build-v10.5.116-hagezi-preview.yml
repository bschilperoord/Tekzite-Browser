name: Build HaGeZi Privacy Core preview

on:
  push:
    branches:
      - "dev/v10.5.116-hagezi-privacy-core"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m py_compile main.py browser_features.py hagezi_privacy.py engine/net.py engine/features.py tekzite_network.py tekzite_network_fast.py
      - name: Run HaGeZi regression
        run: python -m pytest -q tests/current/test_v105116_hagezi_privacy.py
      - name: Live HaGeZi source smoke
        run: |
          python - <<'PY'
          import tempfile
          import hagezi_privacy
          with tempfile.TemporaryDirectory() as directory:
              result = hagezi_privacy.update_if_due(
                  directory, enabled=True, auto_update=True, force=True, timeout=12
              )
              print(result)
              assert result.get("result") in {"updated", "not-modified"}, result
              assert int(result.get("entries", 0) or 0) >= hagezi_privacy.MIN_VALID_ENTRIES, result
          PY
      - name: Run current regression suite
        run: python -m pytest -q tests/current
      - name: Check extension JavaScript
        run: |
          node --check chromium_zoom_extension/background.js
          node --check chromium_zoom_extension/features.js
          node tests/current/test_extension_features.cjs

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Run current regression suite
        shell: pwsh
        run: python -m pytest -q tests\current
      - name: Test Chromium extension scripts
        shell: pwsh
        run: |
          node --check chromium_zoom_extension\background.js
          node --check chromium_zoom_extension\features.js
          node tests\current\test_extension_features.cjs
      - name: Build Windows x64
        shell: pwsh
        run: .\build_windows.ps1
      - name: Package preview
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exeName = "Tekzite-Browser-v10.5.116-HaGeZi-Preview-Windows-x64.exe"
          Copy-Item ".\dist\TekziteBrowser.exe" ".\$exeName" -Force
          $exeHash = (Get-FileHash ".\$exeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$exeHash  $exeName") | Set-Content ".\SHA256SUMS-HaGeZi-Preview.txt" -Encoding ascii
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Tekzite-Browser-v10.5.116-HaGeZi-Preview-Windows-x64
          path: |
            Tekzite-Browser-v10.5.116-HaGeZi-Preview-Windows-x64.exe
            SHA256SUMS-HaGeZi-Preview.txt
          if-no-files-found: error
          retention-days: 14
