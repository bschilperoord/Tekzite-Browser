name: Build Tekzite Browser v10.5.56 Windows icon test

on:
  push:
    branches:
      - build/v10.5.56-icon

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v10.5.56 native identity changes
        shell: pwsh
        run: python .build/apply-v10.5.56.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Render Tekzite application icon
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          @'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          import math

          S = 1024
          img = Image.new("RGBA", (S, S), (2, 6, 12, 255))

          # Deep cyan-tinted radial glow behind the mark.
          glow = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          gp = glow.load()
          cx = cy = S / 2
          for y in range(S):
              for x in range(S):
                  d = math.hypot(x-cx, y-cy) / (S * 0.62)
                  a = max(0, int(105 * (1 - min(1, d)) ** 2))
                  gp[x, y] = (0, 225, 235, a)
          img = Image.alpha_composite(img, glow)

          d = ImageDraw.Draw(img)

          # Rounded outer frame.
          d.rounded_rectangle((45, 45, S-45, S-45), radius=150, outline=(0, 248, 255, 240), width=18)
          d.rounded_rectangle((68, 68, S-68, S-68), radius=132, outline=(0, 80, 92, 160), width=5)

          # Subtle geometric/web arcs, deliberately calm rather than aggressive.
          teal = (0, 210, 222, 145)
          teal_dim = (0, 116, 130, 105)
          for inset in (125, 175, 225, 275):
              box = (inset, inset, S-inset, S-inset)
              d.arc(box, 195, 345, fill=teal_dim, width=5)
              d.arc(box, 15, 165, fill=teal_dim, width=5)
          for angle in range(0, 360, 30):
              r1, r2 = 250, 420
              a = math.radians(angle)
              x1, y1 = cx + math.cos(a)*r1, cy + math.sin(a)*r1
              x2, y2 = cx + math.cos(a)*r2, cy + math.sin(a)*r2
              d.line((x1, y1, x2, y2), fill=teal_dim, width=4)

          # Soft shadow behind the T.
          shadow = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          sd = ImageDraw.Draw(shadow)
          top = [(286, 267), (738, 267), (738, 365), (582, 365), (582, 760), (442, 760), (442, 365), (286, 365)]
          sd.polygon([(x+12, y+18) for x, y in top], fill=(0, 0, 0, 210))
          shadow = shadow.filter(ImageFilter.GaussianBlur(18))
          img = Image.alpha_composite(img, shadow)
          d = ImageDraw.Draw(img)

          # Main Tekzite T. White face, restrained cyan side accent.
          accent_poly = [(300, 282), (752, 282), (752, 380), (596, 380), (596, 776), (456, 776), (456, 380), (300, 380)]
          d.polygon(accent_poly, fill=(0, 210, 222, 255))
          main_poly = [(276, 258), (724, 258), (724, 350), (570, 350), (570, 744), (430, 744), (430, 350), (276, 350)]
          d.polygon(main_poly, fill=(245, 250, 252, 255))
          d.line(main_poly + [main_poly[0]], fill=(155, 238, 244, 255), width=7, joint="curve")

          # Tiny center notch gives the glyph a custom Tekzite feel without looking weapon-like.
          d.polygon([(486, 350), (514, 350), (500, 383)], fill=(2, 18, 25, 255))

          img = img.resize((512, 512), Image.Resampling.LANCZOS)
          png = Path("assets/tekzite.png")
          ico = Path("assets/tekzite.ico")
          img.save(png, optimize=True)
          img.save(ico, format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print(f"Rendered {png} and {ico}")
          '@ | python -
          if (-not (Test-Path assets\tekzite.ico)) { throw "tekzite.ico was not generated" }

      - name: Validate patched source
        shell: pwsh
        run: |
          python -m py_compile main.py browser_features.py engine\net.py
          @'
          from pathlib import Path
          source = Path("main.py").read_text(encoding="utf-8")
          assert 'BROWSER_VERSION = "10.5.56"' in source
          assert 'Tekzite.Browser' in source
          assert 'WM_SETICON' in source
          assert Path('assets/tekzite.ico').is_file()
          assert Path('assets/tekzite.png').is_file()
          print('v10.5.56 native identity/icon checks passed')
          '@ | python -

      - name: Build Windows x64 EXE
        shell: pwsh
        run: .\build_windows.ps1

      - name: Verify Windows executable metadata
        shell: pwsh
        run: |
          $exe = Get-Item .\dist\TekziteBrowser.exe
          Write-Host "Product: $($exe.VersionInfo.ProductName)"
          Write-Host "Version: $($exe.VersionInfo.ProductVersion)"
          if ($exe.VersionInfo.ProductName -ne "Tekzite Browser") { throw "Unexpected product name" }
          if ($exe.VersionInfo.ProductVersion -ne "10.5.56") { throw "Unexpected product version" }

      - name: Package build
        shell: pwsh
        run: |
          $name = "Tekzite-Browser-v10.5.56-Windows-x64.exe"
          Copy-Item .\dist\TekziteBrowser.exe ".\$name" -Force
          Compress-Archive -Path ".\$name" -DestinationPath ".\Tekzite-Browser-v10.5.56-Windows-x64.zip" -CompressionLevel Optimal
          Get-FileHash ".\$name" -Algorithm SHA256 | Format-List

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Tekzite-Browser-v10.5.56-Windows-x64
          path: |
            Tekzite-Browser-v10.5.56-Windows-x64.exe
            Tekzite-Browser-v10.5.56-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
