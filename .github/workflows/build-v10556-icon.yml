name: Build Tekzite Browser v10.5.58 Windows icon test

on:
  push:
    branches:
      - build/v10.5.58-google-auth

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v10.5.58 native identity changes
        shell: pwsh
        run: python .build/apply-v10.5.58.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Render Tekzite application icon without external packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          @'
          from pathlib import Path
          import math, struct, zlib, binascii

          S = 256
          pixels = bytearray(S * S * 4)

          def put(x, y, rgba):
              if not (0 <= x < S and 0 <= y < S):
                  return
              i = (y * S + x) * 4
              r, g, b, a = rgba
              if a >= 255:
                  pixels[i:i+4] = bytes((r, g, b, 255))
                  return
              br, bg, bb, ba = pixels[i:i+4]
              alpha = a / 255.0
              pixels[i] = int(r * alpha + br * (1-alpha))
              pixels[i+1] = int(g * alpha + bg * (1-alpha))
              pixels[i+2] = int(b * alpha + bb * (1-alpha))
              pixels[i+3] = 255

          def fill_rect(x0, y0, x1, y1, c):
              for y in range(max(0,y0), min(S,y1)):
                  for x in range(max(0,x0), min(S,x1)):
                      put(x, y, c)

          def line(x0, y0, x1, y1, c, width=1):
              dx, dy = abs(x1-x0), -abs(y1-y0)
              sx, sy = (1 if x0<x1 else -1), (1 if y0<y1 else -1)
              err = dx + dy
              while True:
                  half = width // 2
                  for yy in range(y0-half, y0-half+width):
                      for xx in range(x0-half, x0-half+width):
                          put(xx, yy, c)
                  if x0 == x1 and y0 == y1:
                      break
                  e2 = 2 * err
                  if e2 >= dy:
                      err += dy; x0 += sx
                  if e2 <= dx:
                      err += dx; y0 += sy

          # Dark cyan radial background.
          cx = cy = (S-1) / 2
          for y in range(S):
              for x in range(S):
                  d = min(1.0, math.hypot(x-cx, y-cy) / 160.0)
                  glow = int(22 * (1-d) ** 2)
                  put(x, y, (2, 8 + glow, 14 + glow, 255))

          # Calm geometric web.
          for radius in (58, 78, 98):
              points=[]
              for deg in range(0, 361, 4):
                  a=math.radians(deg)
                  points.append((int(cx+math.cos(a)*radius), int(cy+math.sin(a)*radius)))
              for p, q in zip(points, points[1:]):
                  line(*p, *q, (0, 115, 128, 80), 1)
          for deg in range(0, 360, 30):
              a=math.radians(deg)
              line(int(cx+math.cos(a)*58), int(cy+math.sin(a)*58),
                   int(cx+math.cos(a)*108), int(cy+math.sin(a)*108),
                   (0, 130, 143, 95), 1)

          # Teal frame.
          for w in range(4):
              inset = 9 + w
              for x in range(inset+18, S-inset-18):
                  put(x, inset, (0, 235, 242, 235)); put(x, S-1-inset, (0, 235, 242, 235))
              for y in range(inset+18, S-inset-18):
                  put(inset, y, (0, 235, 242, 235)); put(S-1-inset, y, (0, 235, 242, 235))
              r=18
              for deg in range(180,271):
                  a=math.radians(deg); put(inset+r+int(math.cos(a)*r), inset+r+int(math.sin(a)*r), (0,235,242,235))
              for deg in range(270,361):
                  a=math.radians(deg); put(S-1-inset-r+int(math.cos(a)*r), inset+r+int(math.sin(a)*r), (0,235,242,235))
              for deg in range(0,91):
                  a=math.radians(deg); put(S-1-inset-r+int(math.cos(a)*r), S-1-inset-r+int(math.sin(a)*r), (0,235,242,235))
              for deg in range(90,181):
                  a=math.radians(deg); put(inset+r+int(math.cos(a)*r), S-1-inset-r+int(math.sin(a)*r), (0,235,242,235))

          # Soft offset teal accent and clean white T.
          fill_rect(75, 70, 191, 96, (0, 202, 215, 255))
          fill_rect(117, 91, 157, 198, (0, 202, 215, 255))
          fill_rect(68, 63, 184, 89, (246, 250, 252, 255))
          fill_rect(110, 84, 150, 191, (246, 250, 252, 255))
          line(68,63,184,63,(150,239,244,255),2)
          line(68,89,110,89,(150,239,244,255),2)
          line(150,89,184,89,(150,239,244,255),2)
          line(110,84,110,191,(150,239,244,255),2)
          line(150,84,150,191,(150,239,244,255),2)

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind+data) & 0xffffffff)

          rows = bytearray()
          for y in range(S):
              rows.append(0)
              start = y*S*4
              rows.extend(pixels[start:start+S*4])
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', S, S, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(bytes(rows), 9)) + chunk(b'IEND', b'')
          Path('assets/tekzite.png').write_bytes(png)

          # ICO with one 256x256 PNG image. Windows scales it for small taskbar sizes.
          header = struct.pack('<HHH', 0, 1, 1)
          entry = struct.pack('<BBBBHHII', 0, 0, 0, 0, 1, 32, len(png), 22)
          Path('assets/tekzite.ico').write_bytes(header + entry + png)
          print('Rendered assets/tekzite.png and assets/tekzite.ico')
          '@ | python -
          if (-not (Test-Path assets\tekzite.ico)) { throw "tekzite.ico was not generated" }

      - name: Install Windows runtime dependencies with retry
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {
            python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Runtime dependency install attempt $i failed; retrying..." -ForegroundColor Yellow
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) { throw "Could not install Windows runtime dependencies after retries" }

      - name: Validate patched source
        shell: pwsh
        run: |
          python -m py_compile main.py browser_features.py engine\net.py
          @'
          from pathlib import Path
          source = Path("main.py").read_text(encoding="utf-8")
          assert 'BROWSER_VERSION = "10.5.58"' in source
          assert 'Tekzite.Browser' in source
          assert 'WM_SETICON' in source
          assert 'GWLP_HWNDPARENT = -8' in source
          assert 'WS_EX_APPWINDOW = 0x00040000' in source
          assert 'SWP_FRAMECHANGED = 0x0020' in source
          assert 'def _taskbar_presence_guard(self):' in source
          assert 'self._apply_frameless_app_style()' in source
          assert 'def _rearm_dwm_input_after_maximize(self):' in source
          assert 'refresh_embedded_chromium_dwm_input_metrics' in source
          assert 'def _is_google_auth_url(url):' in source
          assert 'def _maybe_start_google_auth_handoff(self, url, previous_url="", tab=None):' in source
          assert 'start_standalone_auth_chromium' in source
          maximize = source[source.index('    def _toggle_maximize(self):'):source.index('    def _schedule_taskbar_restore_check', source.index('    def _toggle_maximize(self):'))]
          assert 'self.root.after_idle(self._rearm_dwm_input_after_maximize)' in maximize
          assert 'self.root.after(55, self._rearm_dwm_input_after_maximize)' in maximize
          assert 'self.root.after(150, self._rearm_dwm_input_after_maximize)' in maximize
          minimize = source[source.index('    def _minimize_window(self):'):source.index('    def _restore_frameless_after_minimize', source.index('    def _minimize_window(self):'))]
          assert minimize.index('self.root.overrideredirect(False)') < minimize.index('self._apply_frameless_app_style()') < minimize.index('self.root.iconify()')
          assert Path('assets/tekzite.ico').is_file()
          assert Path('assets/tekzite.png').is_file()

          from main import BrowserApp
          rejected = (
              "https://accounts.google.com/v3/signin/rejected?"
              "continue=https%3A%2F%2Fwww.youtube.com%2Fsignin%3F"
              "action_handle_signin%3Dtrue%26next%3Dhttps%253A%252F%252Fwww.youtube.com%252F"
          )
          assert BrowserApp._is_google_auth_url(rejected)
          launch, ret = BrowserApp._google_auth_handoff_urls(
              rejected, "https://www.youtube.com/"
          )
          assert launch.startswith("https://www.youtube.com/signin")
          assert ret == "https://www.youtube.com/"

          import inspect
          import engine.net as net
          auth_src = inspect.getsource(net.start_standalone_auth_chromium)
          assert "--new-window" in auth_src
          assert "--remote-debugging" not in auth_src
          assert "--app=" not in auth_src
          assert '"remote_debugging": False' in auth_src
          assert '"cdp_control": False' in auth_src
          print('v10.5.58 native identity, taskbar, maximize input, and Google auth checks passed')
          '@ | python -

      - name: Build Windows x64 EXE
        shell: pwsh
        run: .\build_windows.ps1

      - name: Verify Windows executable metadata
        shell: pwsh
        run: |
          $exe = Get-Item .\dist\TekziteBrowser.exe
          Write-Host "Product: $($exe.VersionInfo.ProductName)"
          Write-Host "Version: $($exe.VersionInfo.ProductVersion)"
          if ($exe.VersionInfo.ProductName -ne "Tekzite Browser") { throw "Unexpected product name" }
          if ($exe.VersionInfo.ProductVersion -ne "10.5.58") { throw "Unexpected product version" }

      - name: Package build
        shell: pwsh
        run: |
          $name = "Tekzite-Browser-v10.5.58-Windows-x64.exe"
          Copy-Item .\dist\TekziteBrowser.exe ".\$name" -Force
          Compress-Archive -Path ".\$name" -DestinationPath ".\Tekzite-Browser-v10.5.58-Windows-x64.zip" -CompressionLevel Optimal
          Get-FileHash ".\$name" -Algorithm SHA256 | Format-List

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Tekzite-Browser-v10.5.58-Windows-x64
          path: |
            Tekzite-Browser-v10.5.58-Windows-x64.exe
            Tekzite-Browser-v10.5.58-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
