name: Build Windows v10.5.32
on:
  push:
    branches: [build/windows-v10.5.32]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f4fe53cc5b047bf6006928a156871abbe72ecb8
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build exact release source
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Validate and package executable
        shell: pwsh
        run: |
          $exe = Get-Item dist/TekziteBrowser.exe
          if ($exe.VersionInfo.FileVersion -ne '10.5.32.0') { throw "Unexpected version: $($exe.VersionInfo.FileVersion)" }
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 60)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw "Not an x64 executable" }
          Copy-Item $exe.FullName dist/Tekzite-Browser-v10.5.32-Windows-x64.exe
          $hash = (Get-FileHash dist/Tekzite-Browser-v10.5.32-Windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Tekzite-Browser-v10.5.32-Windows-x64.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Tekzite-Browser-v10.5.32-Windows-x64
          path: |
            dist/Tekzite-Browser-v10.5.32-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
