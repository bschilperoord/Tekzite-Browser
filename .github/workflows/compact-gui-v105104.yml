name: One-shot compact GUI v10.5.104

on:
  push:
    branches: [dev/v10.5.104-tabs-closer-omnibar]

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Tighten Tekzite GUI spacing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          data = path.read_bytes()
          crlf = b"\r\n" in data
          text = data.decode("utf-8").replace("\r\n", "\n")

          replacements = [
              ('    "density": "spacious",\n    "spacing_generation": 2,',
               '    "density": "comfortable",\n    "spacing_generation": 3,'),
              ('    "tab_min_width": 175,\n    "tab_max_width": 330,',
               '    "tab_min_width": 160,\n    "tab_max_width": 300,'),
              ('    "app_bar_height": 44,\n    "tab_bar_height": 52,\n    "toolbar_height": 72,\n    "status_bar_height": 30,\n    "find_bar_height": 46,',
               '    "app_bar_height": 40,\n    "tab_bar_height": 46,\n    "toolbar_height": 62,\n    "status_bar_height": 26,\n    "find_bar_height": 40,'),
              ('    out["density"] = str(out.get("density") or "spacious") if str(out.get("density") or "spacious") in ("compact", "comfortable", "spacious") else "spacious"\n    out["spacing_generation"] = 2',
               '    out["density"] = str(out.get("density") or "comfortable") if str(out.get("density") or "comfortable") in ("compact", "comfortable", "spacious") else "comfortable"\n    out["spacing_generation"] = 3'),
              ('        return {"compact": 0.84, "comfortable": 1.0, "spacious": 1.18}.get(str(self._custom("density", "spacious")), 1.0)',
               '        return {"compact": 0.84, "comfortable": 1.0, "spacious": 1.18}.get(str(self._custom("density", "comfortable")), 1.0)'),
              ('height=self._ui_metric("app_bar_height", 44)', 'height=self._ui_metric("app_bar_height", 40)'),
              ('height=self._ui_metric("tab_bar_height", 52)', 'height=self._ui_metric("tab_bar_height", 46)'),
              ('height=self._ui_metric("toolbar_height", 72)', 'height=self._ui_metric("toolbar_height", 62)'),
              ('height=self._ui_metric("status_bar_height", 30)', 'height=self._ui_metric("status_bar_height", 26)'),
              ('self._ui_metric("find_bar_height", 46)', 'self._ui_metric("find_bar_height", 40)'),
              ('self._outer_pad = max(6, app._ui_padding(7))\n        self._row_h = max(34, app._ui_padding(36))\n        self._separator_h = max(8, app._ui_padding(9))',
               'self._outer_pad = max(5, app._ui_padding(6))\n        self._row_h = max(30, app._ui_padding(32))\n        self._separator_h = max(6, app._ui_padding(7))'),
              ('self.app_brand.pack(side="left", padx=(self._ui_padding(16), self._ui_padding(14)), fill="y")',
               'self.app_brand.pack(side="left", padx=(self._ui_padding(12), self._ui_padding(10)), fill="y")'),
              ('self.brand_badge.pack(side="left", pady=self._ui_padding(5))',
               'self.brand_badge.pack(side="left", pady=self._ui_padding(3))'),
              ('self.title_label.pack(side="left", padx=(self._ui_padding(7), 0))',
               'self.title_label.pack(side="left", padx=(self._ui_padding(5), 0))'),
              ('self.window_controls.pack(side="right", fill="y", padx=(self._ui_padding(8), self._ui_padding(14)), pady=self._ui_padding(7))',
               'self.window_controls.pack(side="right", fill="y", padx=(self._ui_padding(6), self._ui_padding(10)), pady=self._ui_padding(4))'),
              ('self.window_controls.pack(side="left", fill="y", padx=(self._ui_padding(14), self._ui_padding(6)), pady=self._ui_padding(7), before=self.app_brand)',
               'self.window_controls.pack(side="left", fill="y", padx=(self._ui_padding(10), self._ui_padding(5)), pady=self._ui_padding(4), before=self.app_brand)'),
              ('font=(self._ui_font_family, max(10, int(self._custom("tab_font_size", 9)) + 4)),\n            padx=self._ui_padding(12), pady=self._ui_padding(6), width=None,',
               'font=(self._ui_font_family, max(10, int(self._custom("tab_font_size", 9)) + 4)),\n            padx=self._ui_padding(10), pady=self._ui_padding(5), width=None,'),
              ('padx=self._ui_padding(14), pady=self._ui_padding(9), width=width,',
               'padx=self._ui_padding(10), pady=self._ui_padding(6), width=width,'),
              ('self.address_inner.pack(fill="both", expand=True, padx=self._ui_padding(9), pady=self._ui_padding(6))',
               'self.address_inner.pack(fill="both", expand=True, padx=self._ui_padding(7), pady=self._ui_padding(4))'),
              ('self.site_info_button.pack(side="left", padx=(self._ui_padding(8), self._ui_padding(2)))',
               'self.site_info_button.pack(side="left", padx=(self._ui_padding(6), self._ui_padding(2)))'),
              ('padx=(self._ui_padding(3), self._ui_padding(6)), pady=self._ui_padding(1))',
               'padx=(self._ui_padding(2), self._ui_padding(5)), pady=self._ui_padding(1))'),
              ('self.find_entry.pack(side="left", fill="x", expand=True, padx=(16, 8), pady=8)',
               'self.find_entry.pack(side="left", fill="x", expand=True, padx=(12, 6), pady=5)'),
              ('highlightthickness=0, cursor="hand2", padx=10, pady=3, font=(self._ui_font_family, self._font_size(9)))',
               'highlightthickness=0, cursor="hand2", padx=8, pady=2, font=(self._ui_font_family, self._font_size(9)))'),
              ('b.pack(side="left", padx=(0, 5), pady=5)',
               'b.pack(side="left", padx=(0, 4), pady=3)'),
              ('self.status_activity_dot.pack(side="left", padx=(self._ui_padding(16), self._ui_padding(8)))',
               'self.status_activity_dot.pack(side="left", padx=(self._ui_padding(10), self._ui_padding(6)))'),
              ('self.status_version_label.pack(side="right", padx=(self._ui_padding(10), self._ui_padding(16)))',
               'self.status_version_label.pack(side="right", padx=(self._ui_padding(8), self._ui_padding(12)))'),
              ('+ int(button.winfo_height()) + self._ui_padding(3)',
               '+ int(button.winfo_height()) + self._ui_padding(2)'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing replacement marker: {old[:120]!r}")
              text = text.replace(old, new)

          old_migration = '''    # v10.5.15: migrate only an untouched v10.5.14 layout to the new spacious
              # defaults. Any user-adjusted spacing/size value opts out automatically.
              legacy_layout = {
                  "font_size": 10, "tab_font_size": 9, "toolbar_font_size": 10,
                  "ui_scale": 1.0, "density": "comfortable", "tab_title_chars": 24,
                  "tab_min_width": 150, "tab_max_width": 290,
                  "window_corner_radius": 22, "content_corner_radius": 16, "control_corner_radius": 14,
                  "app_bar_height": 38, "tab_bar_height": 44, "toolbar_height": 62,
                  "status_bar_height": 26, "find_bar_height": 40,
                  "window_width": 1360, "window_height": 860,
                  "window_min_width": 900, "window_min_height": 600,
              }
              if src and int(src.get("spacing_generation", 1) or 1) < 2:
                  untouched = all(src.get(key, expected) == expected for key, expected in legacy_layout.items())
                  if untouched:
                      src = dict(src)
                      for key in legacy_layout:
                          src[key] = DEFAULT_CUSTOMIZATION[key]
                      src["spacing_generation"] = 2
          '''.replace("              ", "    ")
          new_migration = '''    # v10.5.104: migrate only untouched historical spacing baselines to the
              # tighter current shell. Any user-adjusted size/density keeps its values.
              legacy_layout = {
                  "font_size": 10, "tab_font_size": 9, "toolbar_font_size": 10,
                  "ui_scale": 1.0, "density": "comfortable", "tab_title_chars": 24,
                  "tab_min_width": 150, "tab_max_width": 290,
                  "window_corner_radius": 22, "content_corner_radius": 16, "control_corner_radius": 14,
                  "app_bar_height": 38, "tab_bar_height": 44, "toolbar_height": 62,
                  "status_bar_height": 26, "find_bar_height": 40,
                  "window_width": 1360, "window_height": 860,
                  "window_min_width": 900, "window_min_height": 600,
              }
              spacious_layout = {
                  "font_size": 11, "tab_font_size": 10, "toolbar_font_size": 11,
                  "ui_scale": 1.0, "density": "spacious", "tab_title_chars": 28,
                  "tab_min_width": 175, "tab_max_width": 330,
                  "window_corner_radius": 24, "content_corner_radius": 18, "control_corner_radius": 16,
                  "app_bar_height": 44, "tab_bar_height": 52, "toolbar_height": 72,
                  "status_bar_height": 30, "find_bar_height": 46,
                  "window_width": 1440, "window_height": 900,
                  "window_min_width": 960, "window_min_height": 640,
              }
              if src:
                  try:
                      spacing_generation = int(src.get("spacing_generation", 1) or 1)
                  except Exception:
                      spacing_generation = 1
                  if spacing_generation < 3:
                      expected_layout = legacy_layout if spacing_generation < 2 else spacious_layout
                      untouched = all(
                          src.get(key, expected) == expected
                          for key, expected in expected_layout.items()
                      )
                      src = dict(src)
                      if untouched:
                          for key in expected_layout:
                              src[key] = DEFAULT_CUSTOMIZATION[key]
                      src["spacing_generation"] = 3
          '''.replace("              ", "    ")
          if old_migration not in text:
              raise SystemExit("migration block marker missing")
          text = text.replace(old_migration, new_migration)

          old_tab_initial = '''        self.tab_items = tk.Frame(self.tab_bar, bg=self.ui["chrome"])
              self.tab_items.pack(side="left", fill="both", expand=True, padx=(self._ui_padding(16), self._ui_padding(10)), pady=(self._ui_padding(8), self._ui_padding(7)))
          '''.replace("              ", "        ")
          new_tab_initial = '''        self.tab_items = tk.Frame(self.tab_bar, bg=self.ui["chrome"])
              tab_above_toolbar = self._custom("tab_position", "above_toolbar") == "above_toolbar"
              tab_items_pady = (
                  (self._ui_padding(6), self._ui_padding(2))
                  if tab_above_toolbar
                  else (self._ui_padding(2), self._ui_padding(6))
              )
              self.tab_items.pack(
                  side="left", fill="both", expand=True,
                  padx=(self._ui_padding(12), self._ui_padding(8)),
                  pady=tab_items_pady,
              )
          '''.replace("              ", "        ")
          if old_tab_initial not in text:
              raise SystemExit("initial tab layout marker missing")
          text = text.replace(old_tab_initial, new_tab_initial)

          old_toolbar = '''        visible = self._custom("toolbar_visible", {})
              order = self._custom("toolbar_order", TOOLBAR_ITEM_IDS)
              gap = self._ui_padding(7)
              outer = self._ui_padding(12)
              for item in order:
                  widget = widgets.get(item)
                  if widget is None or not bool(visible.get(item, True)):
                      continue
                  if item == "address":
                      widget.pack(side="left", fill="x", expand=True, padx=(self._ui_padding(12), outer), pady=outer)
                  else:
                      widget.pack(side="left", padx=(0, gap), pady=self._ui_padding(10))
          '''.replace("              ", "        ")
          new_toolbar = '''        visible = self._custom("toolbar_visible", {})
              order = self._custom("toolbar_order", TOOLBAR_ITEM_IDS)
              gap = self._ui_padding(5)
              outer = self._ui_padding(9)
              tab_above_toolbar = self._custom("tab_position", "above_toolbar") == "above_toolbar"
              adjacent_pad = self._ui_padding(3)
              far_pad = self._ui_padding(8)
              toolbar_pady = (
                  (adjacent_pad, far_pad)
                  if tab_above_toolbar
                  else (far_pad, adjacent_pad)
              )
              for item in order:
                  widget = widgets.get(item)
                  if widget is None or not bool(visible.get(item, True)):
                      continue
                  if item == "address":
                      widget.pack(
                          side="left", fill="x", expand=True,
                          padx=(self._ui_padding(9), outer),
                          pady=toolbar_pady,
                      )
                  else:
                      widget.pack(side="left", padx=(0, gap), pady=toolbar_pady)
          '''.replace("              ", "        ")
          if old_toolbar not in text:
              raise SystemExit("toolbar layout marker missing")
          text = text.replace(old_toolbar, new_toolbar)

          old_repack = '''        try:
              self.tab_items.pack_forget()
              self.tab_items.pack(side="left", fill="both", expand=True, padx=(self._ui_padding(16), self._ui_padding(10)), pady=(self._ui_padding(8), self._ui_padding(7)))
              self._place_new_tab_button_inline()
          except Exception:
              pass
          '''.replace("          ", "        ")
          new_repack = '''        try:
              self.tab_items.pack_forget()
              tab_items_pady = (
                  (self._ui_padding(6), self._ui_padding(2))
                  if tab_first
                  else (self._ui_padding(2), self._ui_padding(6))
              )
              self.tab_items.pack(
                  side="left", fill="both", expand=True,
                  padx=(self._ui_padding(12), self._ui_padding(8)),
                  pady=tab_items_pady,
              )
              self._place_new_tab_button_inline()
          except Exception:
              pass
          '''.replace("          ", "        ")
          if old_repack not in text:
              raise SystemExit("repack tab marker missing")
          text = text.replace(old_repack, new_repack)

          # Customize Tekzite: keep explanatory copy beside labels instead of
          # stacking helper paragraphs underneath them.
          old_visible = '''        right = tk.Frame(toolbar_page, bg=self.ui["bg"], padx=24); right.pack(side="left", fill="both", expand=True, pady=8)
        label(right, "Visible items", bold=True).pack(anchor="w", pady=(0, 5))
        for item in TOOLBAR_ITEM_IDS:
            check(right, TOOLBAR_ITEM_NAMES[item], visible_vars[item]).pack(anchor="w", pady=2)
        label(right, "Tip: hiding the address bar is safe. Ctrl+L reveals it whenever you need it.", muted=True).pack(anchor="w", pady=(12, 0))
'''
          new_visible = '''        right = tk.Frame(toolbar_page, bg=self.ui["bg"], padx=18); right.pack(side="left", fill="both", expand=True, pady=6)
        visible_header = tk.Frame(right, bg=self.ui["bg"])
        visible_header.pack(fill="x", pady=(0, 5))
        label(visible_header, "Visible items", bold=True).pack(side="left")
        label(visible_header, "Ctrl+L reveals a hidden address bar.", muted=True).pack(side="right")
        for item in TOOLBAR_ITEM_IDS:
            check(right, TOOLBAR_ITEM_NAMES[item], visible_vars[item]).pack(anchor="w", pady=1)
'''
          if old_visible not in text:
              raise SystemExit("Customize visible-items marker missing")
          text = text.replace(old_visible, new_visible)

          old_behavior = '''        label(behavior_page, "Homepage", bold=True).pack(anchor="w", pady=(5, 2))
        entry(behavior_page, homepage_var).pack(fill="x", ipady=5, pady=(0, 10))

        search_row = tk.Frame(behavior_page, bg=self.ui["bg"])
        search_row.pack(fill="x", pady=(2, 7))
        label(search_row, "Search engine", bold=True, width=18).pack(side="left")
        search_engine_box = ttk.Combobox(
            search_row,
            textvariable=search_engine_var,
            values=list(SEARCH_ENGINE_PRESETS) + [CUSTOM_SEARCH_ENGINE],
            state="readonly",
            width=24,
        )
        search_engine_box.pack(side="left")

        label(behavior_page, "Search URL template", bold=True).pack(anchor="w", pady=(7, 2))
        search_template_entry = entry(behavior_page, search_var)
        search_template_entry.pack(fill="x", ipady=5, pady=(0, 5))
        label(
            behavior_page,
            "Choose a provider above, or use Custom with {query}. Local SearXNG URLs work here too.",
            muted=True,
        ).pack(anchor="w", pady=(0, 10))
'''
          new_behavior = '''        homepage_row = tk.Frame(behavior_page, bg=self.ui["bg"])
        homepage_row.pack(fill="x", pady=(4, 5))
        label(homepage_row, "Homepage", bold=True, width=18).pack(side="left")
        entry(homepage_row, homepage_var).pack(side="left", fill="x", expand=True, ipady=4)

        search_row = tk.Frame(behavior_page, bg=self.ui["bg"])
        search_row.pack(fill="x", pady=5)
        label(search_row, "Search engine", bold=True, width=18).pack(side="left")
        search_engine_box = ttk.Combobox(
            search_row,
            textvariable=search_engine_var,
            values=list(SEARCH_ENGINE_PRESETS) + [CUSTOM_SEARCH_ENGINE],
            state="readonly",
            width=24,
        )
        search_engine_box.pack(side="left")

        search_template_row = tk.Frame(behavior_page, bg=self.ui["bg"])
        search_template_row.pack(fill="x", pady=5)
        label(search_template_row, "Search URL template", bold=True, width=18).pack(side="left")
        search_template_entry = entry(search_template_row, search_var)
        search_template_entry.pack(side="left", fill="x", expand=True, ipady=4)
        label(search_template_row, "Use {query} • local SearXNG supported", muted=True).pack(
            side="left", padx=(10, 0)
        )
'''
          if old_behavior not in text:
              raise SystemExit("Customize behavior marker missing")
          text = text.replace(old_behavior, new_behavior)

          old_recovery = '''        label(advanced_page, "Recovery", bold=True).pack(anchor="w", pady=(18, 5))
        label(advanced_page, "Ctrl+Shift+Alt+R resets the interface only.", muted=True).pack(anchor="w")
'''
          new_recovery = '''        recovery_row = tk.Frame(advanced_page, bg=self.ui["bg"])
        recovery_row.pack(fill="x", pady=(12, 4))
        label(recovery_row, "Recovery", bold=True).pack(side="left")
        label(recovery_row, "Ctrl+Shift+Alt+R resets the interface only.", muted=True).pack(
            side="left", padx=(12, 0)
        )
'''
          if old_recovery not in text:
              raise SystemExit("Customize recovery marker missing")
          text = text.replace(old_recovery, new_recovery)

          # Runtime repack uses the same compact app/status spacing as first paint.
          text = text.replace(
              'self.app_brand.pack(side="left", padx=(self._ui_padding(18), self._ui_padding(16)), fill="y")',
              'self.app_brand.pack(side="left", padx=(self._ui_padding(12), self._ui_padding(10)), fill="y")',
          )
          text = text.replace(
              'self.menu_strip.pack(side="left", fill="y", padx=(0, self._ui_padding(10)))',
              'self.menu_strip.pack(side="left", fill="y", padx=(0, self._ui_padding(6)))',
          )

          encoded = text.replace("\n", "\r\n").encode("utf-8") if crlf else text.encode("utf-8")
          path.write_bytes(encoded)

          # Current regression reflects the new baseline while preserving the
          # explicit guarantee that customized layouts do not get overwritten.
          p = Path("tests/current/test_v10515_spacious_layout.py")
          t = p.read_text(encoding="utf-8")
          t = t.replace("test_spacious_defaults_are_the_new_baseline", "test_comfortable_defaults_are_the_new_baseline")
          t = t.replace('assert c["density"] == "spacious"', 'assert c["density"] == "comfortable"')
          t = t.replace('assert c["tab_min_width"] == 175', 'assert c["tab_min_width"] == 160')
          t = t.replace('assert c["tab_max_width"] == 330', 'assert c["tab_max_width"] == 300')
          t = t.replace('assert c["app_bar_height"] == 44', 'assert c["app_bar_height"] == 40')
          t = t.replace('assert c["tab_bar_height"] == 52', 'assert c["tab_bar_height"] == 46')
          t = t.replace('assert c["toolbar_height"] == 72', 'assert c["toolbar_height"] == 62')
          t = t.replace('assert c["status_bar_height"] == 30', 'assert c["status_bar_height"] == 26')
          t = t.replace('assert c["find_bar_height"] == 46', 'assert c["find_bar_height"] == 40')
          t = t.replace("test_untouched_previous_layout_migrates_to_spacious", "test_untouched_previous_layout_migrates_to_current_compact_spacing")
          t = t.replace('assert migrated["spacing_generation"] == 2', 'assert migrated["spacing_generation"] == 3')
          t = t.replace('assert migrated["density"] == "spacious"', 'assert migrated["density"] == "comfortable"')
          t = t.replace('assert migrated["toolbar_height"] == 72', 'assert migrated["toolbar_height"] == 62')
          t = t.replace('assert migrated["tab_min_width"] == 175', 'assert migrated["tab_min_width"] == 160')
          t = t.replace("test_spacious_padding_is_used_across_primary_chrome", "test_compact_padding_is_used_across_primary_chrome")
          t = t.replace("assert 'gap = self._ui_padding(7)' in MAIN", "assert 'gap = self._ui_padding(5)' in MAIN")
          t = t.replace("assert 'outer = self._ui_padding(12)' in MAIN", "assert 'outer = self._ui_padding(9)' in MAIN")
          t = t.replace("assert 'padx=(self._ui_padding(16), self._ui_padding(10))' in MAIN", "assert 'padx=(self._ui_padding(12), self._ui_padding(8))' in MAIN")
          t = t.replace("assert 'padx=self._ui_padding(14), pady=self._ui_padding(9)' in MAIN", "assert 'padx=self._ui_padding(10), pady=self._ui_padding(6)' in MAIN")
          p.write_text(t, encoding="utf-8")

          Path("tests/current/test_v105104_customize_rows.py").write_text(
              '''import inspect

          import main


          CUSTOMIZE_SOURCE = inspect.getsource(main.BrowserApp._show_customize_browser)


          def test_customize_explanatory_text_is_inline_not_stacked_under_labels():
              assert "visible_header = tk.Frame" in CUSTOMIZE_SOURCE
              assert 'label(visible_header, "Ctrl+L reveals a hidden address bar.", muted=True).pack(side="right")' in CUSTOMIZE_SOURCE
              assert "homepage_row = tk.Frame" in CUSTOMIZE_SOURCE
              assert "search_template_row = tk.Frame" in CUSTOMIZE_SOURCE
              assert '"Use {query} • local SearXNG supported"' in CUSTOMIZE_SOURCE
              assert "recovery_row = tk.Frame" in CUSTOMIZE_SOURCE


          def test_customize_old_stacked_helper_copy_is_gone():
              assert "Tip: hiding the address bar is safe." not in CUSTOMIZE_SOURCE
              assert "Choose a provider above, or use Custom with {query}." not in CUSTOMIZE_SOURCE
              assert 'label(advanced_page, "Ctrl+Shift+Alt+R resets the interface only."' not in CUSTOMIZE_SOURCE
          '''.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )

          Path("tests/current/test_v105104_compact_gui.py").write_text(
              '''import inspect

          import main


          INIT_SOURCE = inspect.getsource(main.BrowserApp.__init__)
          TOOLBAR_SOURCE = inspect.getsource(main.BrowserApp._apply_toolbar_layout)
          REPACK_SOURCE = inspect.getsource(main.BrowserApp._repack_browser_chrome)
          MENU_SOURCE = inspect.getsource(main._AnimatedPopupMenu.__init__)


          def test_current_default_shell_is_tighter_but_readable():
              c = main.DEFAULT_CUSTOMIZATION
              assert c["density"] == "comfortable"
              assert c["spacing_generation"] == 3
              assert (c["app_bar_height"], c["tab_bar_height"], c["toolbar_height"]) == (40, 46, 62)
              assert (c["status_bar_height"], c["find_bar_height"]) == (26, 40)
              assert (c["tab_min_width"], c["tab_max_width"]) == (160, 300)


          def test_tabs_and_omnibar_share_a_tight_boundary():
              assert "(self._ui_padding(6), self._ui_padding(2))" in INIT_SOURCE
              assert "adjacent_pad = self._ui_padding(3)" in TOOLBAR_SOURCE
              assert "far_pad = self._ui_padding(8)" in TOOLBAR_SOURCE
              assert "(self._ui_padding(6), self._ui_padding(2))" in REPACK_SOURCE


          def test_toolbar_controls_use_compact_common_spacing():
              assert "gap = self._ui_padding(5)" in TOOLBAR_SOURCE
              assert "outer = self._ui_padding(9)" in TOOLBAR_SOURCE
              assert "padx=(self._ui_padding(9), outer)" in TOOLBAR_SOURCE


