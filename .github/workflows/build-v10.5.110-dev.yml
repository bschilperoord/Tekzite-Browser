name: Build Windows dev artifact

on:
  push:
    branches:
      - "dev/v10.5.110-manifest-v2-v3"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Python syntax check
        shell: pwsh
        run: python -m py_compile main.py browser_features.py engine\net.py

      - name: Build Windows x64
        shell: pwsh
        run: .\build_windows.ps1

      - name: Package dev build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "10.5.110"
          $exeName = "Tekzite-Browser-v$version-Windows-x64.exe"
          $zipName = "Tekzite-Browser-v$version-Windows-x64.zip"
          Copy-Item ".\dist\TekziteBrowser.exe" ".\$exeName" -Force
          if (Test-Path ".\$zipName") { Remove-Item ".\$zipName" -Force }
          Compress-Archive -Path ".\$exeName" -DestinationPath ".\$zipName" -CompressionLevel Optimal
          $exeHash = (Get-FileHash ".\$exeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash ".\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$exeHash  $exeName", "$zipHash  $zipName") | Set-Content ".\SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows dev build
        uses: actions/upload-artifact@v4
        with:
          name: Tekzite-Browser-v10.5.110-Windows-x64
          path: |
            Tekzite-Browser-v10.5.110-Windows-x64.exe
            Tekzite-Browser-v10.5.110-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
