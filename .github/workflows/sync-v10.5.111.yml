name: Sync v10.5.111 release metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev/v10.5.111-privacy-core-extensions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev/v10.5.111-privacy-core-extensions
          fetch-depth: 0

      - name: Synchronize v10.5.111
        run: python tools/sync_version.py 10.5.111

      - name: Commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Version metadata already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: synchronize v10.5.111 metadata"
          git push origin HEAD:dev/v10.5.111-privacy-core-extensions
