name: Prepare v10.5.91 startup drag release

on:
  push:
    branches: [dev/v10.5.91-startup-drag-priority]
    paths:
      - ".github/workflows/prepare-v10591.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest

    steps:
      - name: Checkout startup-drag branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Add v10.5.91 changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          entry = """# v10.5.91 - Startup drag priority

          - Gives active top-level window dragging priority over cold-start maintenance so the shell stays responsive during the first seconds after launch.
          - Defers forced DWM recrops and visible-surface ImageGrab probes while the user is moving the browser window.
          - Defers Chromium zoom settle passes, DWM zoom refreshes, synchronous zoom watchdog checks, and page-state UI updates until after drag release.
          - Makes root Configure handling effectively zero-work during native window movement and prevents rounding/taskbar helpers from draining Tk idle work mid-drag.
          - Preserves queued DWM geometry state during a drag and performs one exact reconciliation against the final window position after release.
          - Allows the native drag path to adopt a DWM host offset lazily if Chromium becomes visible after the drag already started.
          - Replays deferred startup maintenance in staggered post-drag slices instead of releasing one large callback burst.
          - Keeps normal navigation polling at 8 ms while using a lighter 32 ms polling cadence only during an active top-level drag.
          """
          if not text.startswith("# v10.5.91"):
              p.write_text(entry.strip() + "\n\n" + text.lstrip(), encoding="utf-8")
          '@ | python -

      - name: Synchronize v10.5.91 metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools\sync_version.py 10.5.91
          python tools\sync_version.py 10.5.91 --check

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run full regression suite
        shell: pwsh
        run: python -m pytest -q tests/current

      - name: Test Chromium extension scripts
        shell: pwsh
        run: node tests\current\test_extension_features.cjs

      - name: Run environment doctor
        shell: pwsh
        run: python tools\doctor.py

      - name: Commit prepared release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.whitespace cr-at-eol
          git add -A
          git diff --cached --check
          git commit -m "Prepare Tekzite Browser v10.5.91"
          git push origin HEAD:dev/v10.5.91-startup-drag-priority
