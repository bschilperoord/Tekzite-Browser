name: Import v10.5.89

on:
  push:
    branches: [release/v10.5.89-import]

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout staged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Rebase v10.5.89 onto live GitHub source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = ""
          0..5 | ForEach-Object {
            $b64 += (Get-Content -Raw (".release/v10589-patch.part{0:D2}" -f $_)).Trim()
          }
          $gz = Join-Path $env:RUNNER_TEMP "v10589-minimal.patch.gz"
          [IO.File]::WriteAllBytes($gz, [Convert]::FromBase64String($b64))
          $patch = Join-Path $env:RUNNER_TEMP "v10589-minimal.patch"
          python -c "import gzip,pathlib; pathlib.Path(r'$patch').write_bytes(gzip.decompress(pathlib.Path(r'$gz').read_bytes()))"

          git config core.whitespace cr-at-eol

          # Files that exactly match the local baseline must apply strictly.
          git apply --check --ignore-space-change --whitespace=nowarn --exclude=main.py --exclude=engine/net.py $patch
          if ($LASTEXITCODE -ne 0) { throw "Strict non-main/net v10.5.89 patch failed" }
          git apply --ignore-space-change --whitespace=nowarn --exclude=main.py --exclude=engine/net.py $patch
          if ($LASTEXITCODE -ne 0) { throw "Could not apply strict non-main/net v10.5.89 patch" }

          # main.py/net.py contain two GitHub-only Linux adaptations already.
          # Apply all compatible hunks and accept only those exact pre-existing hunks.
          $ErrorActionPreference = "Continue"
          git apply --reject --ignore-space-change --whitespace=nowarn --include=main.py --include=engine/net.py $patch
          $mergeExit = $LASTEXITCODE
          $ErrorActionPreference = "Stop"

          @'
          from pathlib import Path

          rejects = sorted(Path(".").rglob("*.rej"))
          if len(rejects) != 2:
              raise SystemExit(f"Expected exactly two already-applied Linux rejects, got: {[str(p) for p in rejects]}")

          by_name = {str(p).replace("\\", "/"): p.read_text(encoding="utf-8", errors="replace") for p in rejects}
          net_rej = next((v for k, v in by_name.items() if k.endswith("engine/net.py.rej")), "")
          main_rej = next((v for k, v in by_name.items() if k.endswith("main.py.rej")), "")
          if 'helper_name = "tekzite-network.exe" if os.name == "nt" else "tekzite-network"' not in net_rej:
              raise SystemExit("Unexpected engine/net.py reject")
          if 'if os.name != "nt":' not in main_rej or 'return True' not in main_rej:
              raise SystemExit("Unexpected main.py reject")

          net = Path("engine/net.py").read_text(encoding="utf-8")
          main = Path("main.py").read_text(encoding="utf-8")
          assert 'helper_name = "tekzite-network.exe" if os.name == "nt" else "tekzite-network"' in net
          assert 'exe = root / helper_name' in net
          marker = 'def _use_chromium_software_surface_for_url(self, url):'
          block = main[main.index(marker):main.index(marker) + 1800]
          assert 'if os.name != "nt":' in block and 'return True' in block
          for p in rejects:
              p.unlink()
          '@ | python -

          if ($mergeExit -eq 0) {
            Write-Host "Live main/net required no reject reconciliation."
          } else {
            Write-Host "Reconciled the two GitHub-only Linux hunks already present in live source."
          }

      - name: Preserve GitHub changelog history
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = (Get-Content -Raw ".release/v10589-changelog.part00").Trim()
          $gz = Join-Path $env:RUNNER_TEMP "v10589-changelog.gz"
          [IO.File]::WriteAllBytes($gz, [Convert]::FromBase64String($b64))
          @'
          import gzip
          from pathlib import Path
          import os

          gz = Path(os.environ["RUNNER_TEMP"]) / "v10589-changelog.gz"
          entries = gzip.decompress(gz.read_bytes()).decode("utf-8").strip()
          path = Path("CHANGELOG.md")
          current = path.read_text(encoding="utf-8")
          if not current.lstrip().startswith("# v10.5.89"):
              path.write_text(entries + "\n\n" + current.lstrip(), encoding="utf-8")
          '@ | python -

      - name: Harden Customize Tekzite Windows packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          path = Path("build_windows.ps1")
          text = path.read_text(encoding="utf-8")
          old = "    hiddenimports=[],"
          new = """    # Keep Customize Tekzite's Tk modules explicit in the OneFile graph.
              hiddenimports=[
                  "tkinter.ttk",
                  "tkinter.font",
                  "tkinter.colorchooser",
                  "tkinter.filedialog",
                  "tkinter.messagebox",
                  "tkinter.simpledialog",
              ],"""
          if old in text:
              text = text.replace(old, new, 1)
          elif '"tkinter.ttk"' not in text:
              raise SystemExit("Could not find PyInstaller hiddenimports insertion point")

          marker = 'Write-Host "  - unused heavy Python modules excluded from OneFile"'
          extra = 'Write-Host "  - Customize Tekzite Tk/ttk controls explicitly bundled"'
          if extra not in text:
              if marker not in text:
                  raise SystemExit("Could not find build summary insertion point")
              text = text.replace(marker, marker + "\n" + extra, 1)
          path.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Synchronize release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools\sync_version.py 10.5.89
          python tools\sync_version.py 10.5.89 --check

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Reconcile updated security regression contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          # v10.5.84 deliberately stopped using Chromium's special debug port 0,
          # so the historical security regression must assert the new contract.
          p = Path("tests/current/test_v10511_security_hardening.py")
          s = p.read_text(encoding="utf-8")
          old = '''def test_cdp_uses_chromium_ephemeral_port_and_no_wildcard_origin():
              assert '"--remote-debugging-port=0"' in NET
              assert "--remote-allow-origins=*" not in NET
              assert "DevToolsActivePort" in NET
              assert "_validate_devtools_ws_url" in NET
          '''
          new = '''def test_cdp_uses_explicit_loopback_port_and_no_wildcard_origin():
              assert '"--remote-debugging-port=0"' not in NET
              assert 'f"--remote-debugging-port={port}"' in NET
              assert 'port = _free_loopback_port()' in NET
              assert "--remote-allow-origins=*" not in NET
              assert "DevToolsActivePort" in NET
              assert "_validate_devtools_ws_url" in NET
          '''
          if old in s:
              s = s.replace(old, new, 1)
          elif "def test_cdp_uses_explicit_loopback_port_and_no_wildcard_origin" not in s:
              raise SystemExit("Could not update historical CDP security regression")
          s = s.replace(
              'assert "--remote-debugging-port=0" in SECURITY',
              'assert "port-0 automation signal" in SECURITY',
              1,
          )
          p.write_text(s, encoding="utf-8")

          # The explicit-port unit test also runs on Windows CI, where production
          # code verifies listener ownership. Model that listener as the same fake
          # Chromium process rather than bypassing the ownership rule.
          p = Path("tests/current/test_v10584_cloudflare_compatibility.py")
          s = p.read_text(encoding="utf-8")
          needle = '    monkeypatch.setattr(net, "_read_devtools_active_port", no_active_file)\n'
          addition = (
              needle
              + '    monkeypatch.setattr(net, "_hide_process_windows", lambda *_args, **_kwargs: None)\n'
              + '    monkeypatch.setattr(net, "_listener_pid_for_port", lambda _port: Proc.pid)\n'
          )
          if '_listener_pid_for_port", lambda _port: Proc.pid' not in s:
              if needle not in s:
                  raise SystemExit("Could not locate explicit-port test seam")
              s = s.replace(needle, addition, 1)
          p.write_text(s, encoding="utf-8")
          '@ | python -

      - name: Run full Windows regression suite
        shell: pwsh
        run: python -m pytest -q tests/current

      - name: Test Chromium extension scripts
        shell: pwsh
        run: node tests\current\test_extension_features.cjs

      - name: Run environment doctor
        shell: pwsh
        run: python tools\doctor.py

      - name: Build Windows x64 OneFile
        shell: pwsh
        run: .\build_windows.ps1

      - name: Verify Customize build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path ".\dist\TekziteBrowser.exe")) {
            throw "Windows build did not produce dist\TekziteBrowser.exe"
          }
          python -c "from pathlib import Path; s=Path('build_windows.ps1').read_text(encoding='utf-8'); required=['tkinter.ttk','tkinter.font','tkinter.colorchooser','tkinter.filedialog','tkinter.messagebox','tkinter.simpledialog']; missing=[x for x in required if x not in s]; assert not missing, missing"
          python -m pytest -q tests/current/test_v10589_customize_windows_build.py

      - name: Commit verified v10.5.89 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm -f .github/workflows/import-v10589.yml
          rm -rf build dist
          rm -f tekzite-network.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.whitespace cr-at-eol
          git add -A
          git diff --cached --check
          git commit -m "Release Tekzite Browser v10.5.89"
          git push origin HEAD:main

      - name: Start platform release publishers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-Sleep -Seconds 3
          gh workflow run publish-windows-release.yml --ref main
          if ($LASTEXITCODE -ne 0) { throw "Could not dispatch Windows release publisher" }
          gh workflow run publish-linux-release.yml --ref main
          if ($LASTEXITCODE -ne 0) { throw "Could not dispatch Linux release publisher" }