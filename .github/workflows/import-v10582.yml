name: Import v10.5.82

on:
  push:
    branches: [main]
    paths:
      - ".release/v10582-minimal.patch.gz"
      - ".github/workflows/import-v10582.yml"

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout staged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply v10.5.82 changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patch = Join-Path $env:RUNNER_TEMP "v10582-minimal.patch"
          python -c "import gzip,pathlib; pathlib.Path(r'$patch').write_bytes(gzip.decompress(pathlib.Path(r'.release/v10582-minimal.patch.gz').read_bytes()))"
          git apply --ignore-space-change --whitespace=nowarn --exclude=CHANGELOG.md $patch
          if ($LASTEXITCODE -ne 0) { throw "Could not apply v10.5.82 source patch" }

      - name: Add v10.5.82 changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $entry = @'
          # v10.5.82 - Strict favicon tab ownership

          - Binds every decoded favicon to the exact Tekzite tab, Chromium target, page URL, and favicon source URL that produced it.
          - Clears a site's favicon immediately when that tab starts or observes a navigation, so the previous website's icon cannot linger on the new website.
          - Adds a per-tab page-state epoch so a slow metadata/favicon completion from before a user navigation is ignored instead of writing stale chrome state.
          - Rechecks Chromium's live page URL after the browser-owned favicon fetch; if the target navigated while the icon was downloading, the fetched bytes are discarded.
          - Refetches when a page changes its favicon source instead of keeping a decoded image tied to an older favicon URL.
          - Adds regression coverage for same-tab site changes, stale in-flight favicon results, and navigation-during-fetch ownership races.

          # v10.5.81 - Per-tab Chromium target isolation

          - Fixes later Tekzite tabs accidentally reusing the first tab's already-claimed Chromium bootstrap target.
          - Each new tab now receives its own Chromium page target, so navigating or typing a URL in one tab cannot replace the page owned by another tab.
          - Keeps bootstrap-target reuse limited to the first native startup tab and adds regression coverage for both the first-tab reuse path and later-tab isolation.
          '@
          $current = Get-Content -Raw "CHANGELOG.md"
          if ($current -notmatch '(?m)^# v10\.5\.82\b') {
            Set-Content "CHANGELOG.md" ($entry.Trim() + "`r`n`r`n" + $current) -Encoding utf8
          }

      - name: Synchronize version metadata
        shell: pwsh
        run: |
          python tools\sync_version.py 10.5.82
          python tools\sync_version.py 10.5.82 --check

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run regression suite
        shell: pwsh
        run: python -m pytest -q

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm -f .github/workflows/import-v10582.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -c "from pathlib import Path; p=Path('README.md'); b=p.read_bytes(); b=b.replace(b'v10.5.82 UltraSpeed for Windows  \\r\\n',b'v10.5.82 UltraSpeed for Windows\\r\\n').replace(b'v10.5.82 UltraSpeed for Windows  \\n',b'v10.5.82 UltraSpeed for Windows\\n'); p.write_bytes(b); p=Path('CHANGELOG.md'); b=p.read_bytes(); e=b'\\r\\n' if b'\\r\\n' in b else b'\\n'; p.write_bytes(b.rstrip(b'\\r\\n')+e)"
          git add -u
          git add VALIDATION-v10.5.81.txt VALIDATION-v10.5.82.txt \
            tests/current/test_v10581_tab_target_isolation.py \
            tests/current/test_v10582_favicon_tab_ownership.py
          git config core.whitespace cr-at-eol
          git diff --cached --check
          git commit -m "Release Tekzite Browser v10.5.82"
          git push origin HEAD:main

      - name: Dispatch Windows release workflow
        shell: pwsh
        run: gh workflow run publish-windows-release.yml --ref main
