name: Windows cold DWM fix preview

on:
  push:
    branches: ["fix/cold-dwm-white-surface-v105132"]
    paths:
      - ".github/workflows/windows-cold-dwm-preview.yml"
      - "main.py"
      - "engine/net.py"
      - "tests/current/test_dwm_white_surface_recovery_v105132.py"
      - "tests/current/test_v10568_native_stall_guard.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact DWM fix candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install locked Windows runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw "Windows dependencies failed" }
          python -m pip install --only-binary=:all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Test dependencies failed" }
      - name: Run current Windows regression suite
        shell: pwsh
        run: |
          python -m pytest -q tests/current
          if ($LASTEXITCODE -ne 0) { throw "Regression suite failed" }
          node tests/current/test_extension_features.cjs
          if ($LASTEXITCODE -ne 0) { throw "Extension checks failed" }
      - name: Build Windows executable
        shell: pwsh
        run: |
          ./build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }
      - name: Verify exact version and create SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "10.5.132"
          $exe = Get-Item "dist/TekziteBrowser.exe"
          if (-not $exe.VersionInfo.FileVersion.StartsWith($version)) {
            throw "Unexpected browser version: $($exe.VersionInfo.FileVersion)"
          }
          $name = "Tekzite-Browser-v$version-Cold-DWM-Fix-Windows-x64.exe"
          Copy-Item $exe.FullName $name -Force
          $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $name" | Set-Content "SHA256SUMS-DWM-Fix.txt" -Encoding ascii
      - name: Upload isolated preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tekzite-v10.5.132-Cold-DWM-Fix-preview
          path: |
            Tekzite-Browser-v10.5.132-Cold-DWM-Fix-Windows-x64.exe
            SHA256SUMS-DWM-Fix.txt
          if-no-files-found: error
          retention-days: 14
