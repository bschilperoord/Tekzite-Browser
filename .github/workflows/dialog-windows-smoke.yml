name: Live Windows JavaScript dialog smoke

on:
  push:
    branches:
      - dev/v10.5.108-live-dialog-investigation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-dialog:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-windows.lock

      - name: Run live Edge/Chromium JavaScript-dialog smoke
        shell: pwsh
        run: python tools\live_js_dialog_smoke.py
