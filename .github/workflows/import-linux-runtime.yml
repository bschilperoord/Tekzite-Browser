name: Import Linux runtime backend

on:
  push:
    branches: [linux-port]
    paths:
      - ".linux-port/linux81-runtime.patch.xz.b64"
      - ".linux-port/apply_main.py"
      - ".linux-port/apply_runtime_followup.py"
      - ".github/workflows/import-linux-runtime.yml"

permissions:
  contents: write

jobs:
  import-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: linux-port
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Apply runtime backend
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d .linux-port/linux81-runtime.patch.xz.b64 | xz -d > /tmp/linux81-runtime.patch
          git apply --exclude=main.py --check /tmp/linux81-runtime.patch
          git apply --exclude=main.py /tmp/linux81-runtime.patch
          python .linux-port/apply_main.py
          python .linux-port/apply_runtime_followup.py
          chmod +x build_linux.sh run_linux.sh install_linux.sh
      - name: Full regression suite
        run: python -m pytest -q
      - name: Chromium extension checks
        run: node tests/current/test_extension_features.cjs
      - name: Linux environment doctor
        run: python tools/doctor.py
      - name: Real Chromium Linux smoke
        shell: bash
        run: |
          set -euxo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser || true
          xvfb-run -a python tools/linux_smoke.py
      - name: Commit verified backend
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .linux-port
          rm -f .github/workflows/import-linux-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Linux preview: renderer, process and socket backend"
          git push origin HEAD:linux-port
