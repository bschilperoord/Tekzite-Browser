name: Bug report
description: Report a reproducible Tekzite Browser problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Tekzite Browser. Please avoid including passwords, cookies or private browsing data.
  - type: input
    id: version
    attributes:
      label: Tekzite version
      placeholder: v8.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: chromium
    attributes:
      label: Chromium/Chrome version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Relevant debug output
      description: Paste only the relevant section. Remove personal URLs/tokens if needed.
      render: text
