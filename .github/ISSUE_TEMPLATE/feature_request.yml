name: Feature request
description: Suggest an improvement to Tekzite Browser
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Browser UI
        - Tabs/navigation
        - Chromium/DWM rendering
        - Input/zoom
        - Network/privacy/ad blocking
        - Preferences
        - Developer tooling
        - Other
